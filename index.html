<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internalize — Human Linker</title>
  <style>
    :root {
      --bg-deep: #06080d;
      --bg-panel: #0c1018;
      --bg-input: #111820;
      --border: #1a2535;
      --text: #d8e4f0;
      --text-muted: #6b7f94;
      --neon-green: #3dff9a;
      --neon-green-dim: #1a9d5c;
      --neon-blue: #38c8ff;
      --neon-blue-dim: #1a6a8f;
      --danger: #ff5c7a;
      --success: #3dff9a;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(56, 200, 255, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(61, 255, 154, 0.06), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 0.35rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .status-bar {
      margin-top: 1rem;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      display: none;
      border: 1px solid transparent;
    }

    .status-bar.visible { display: block; }
    .status-bar.ok {
      display: block;
      background: rgba(61, 255, 154, 0.08);
      border-color: var(--neon-green-dim);
      color: var(--neon-green);
    }
    .status-bar.err {
      display: block;
      background: rgba(255, 92, 122, 0.08);
      border-color: #8f3045;
      color: var(--danger);
    }
    .status-bar.info {
      display: block;
      background: rgba(56, 200, 255, 0.08);
      border-color: var(--neon-blue-dim);
      color: var(--neon-blue);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.35);
    }

    .panel.node-panel {
      border-top: 2px solid var(--neon-green);
      box-shadow: 0 -1px 20px rgba(61, 255, 154, 0.06);
    }

    .panel.edge-panel {
      border-top: 2px solid var(--neon-blue);
      box-shadow: 0 -1px 20px rgba(56, 200, 255, 0.06);
    }

    .panel h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .panel .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field textarea {
      min-height: 88px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: var(--neon-blue-dim);
      box-shadow: 0 0 0 2px rgba(56, 200, 255, 0.15);
    }

    .node-panel .field input:focus,
    .node-panel .field textarea:focus {
      border-color: var(--neon-green-dim);
      box-shadow: 0 0 0 2px rgba(61, 255, 154, 0.12);
    }

    .rel-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      min-height: 1.2em;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.15s, transform 0.1s;
    }

    button[type="submit"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button[type="submit"]:not(:disabled):active {
      transform: scale(0.98);
    }

    .btn-node {
      background: linear-gradient(135deg, var(--neon-green-dim), var(--neon-green));
      color: #041008;
    }

    .btn-edge {
      background: linear-gradient(135deg, var(--neon-blue-dim), var(--neon-blue));
      color: #040a10;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    footer span { color: var(--neon-blue); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Internalize</h1>
      <p>MVP 1 — The Human Linker · Input Pane</p>
      <div id="status" class="status-bar" role="status" aria-live="polite"></div>
    </header>

    <div class="grid">
      <section class="panel node-panel">
        <h2>New Concept</h2>
        <p class="subtitle">Paste excerpt, write summary, capture source.</p>
        <form id="node-form">
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required placeholder="e.g. System 1 vs System 2" />
          </div>
          <div class="field">
            <label for="excerpt">Excerpt</label>
            <textarea id="excerpt" name="excerpt" placeholder="Raw fragment from your reading…"></textarea>
          </div>
          <div class="field">
            <label for="summary">Summary</label>
            <textarea id="summary" name="summary" required placeholder="Your processed understanding…"></textarea>
          </div>
          <div class="field">
            <label for="source">Source</label>
            <input id="source" name="source" type="text" placeholder="e.g. Kahneman — Thinking, Fast and Slow" />
          </div>
          <button type="submit" class="btn-node" id="node-submit">Create Node</button>
        </form>
      </section>

      <section class="panel edge-panel">
        <h2>Semantic Edge</h2>
        <p class="subtitle">Link two concepts with a strict relationship type.</p>
        <form id="edge-form">
          <div class="field">
            <label for="source-id">Source Node</label>
            <select id="source-id" name="source_id" required>
              <option value="">— select source —</option>
            </select>
          </div>
          <div class="field">
            <label for="target-id">Target Node</label>
            <select id="target-id" name="target_id" required>
              <option value="">— select target —</option>
            </select>
          </div>
          <div class="field">
            <label for="relationship-type">Relationship Type</label>
            <select id="relationship-type" name="relationship_type" required>
              <option value="">— select type —</option>
            </select>
            <p class="rel-hint" id="rel-hint"></p>
          </div>
          <button type="submit" class="btn-edge" id="edge-submit" disabled>Create Edge</button>
        </form>
      </section>
    </div>

    <footer>API · <span id="api-base"></span></footer>
  </div>

  <script>
    const API_BASE = window.location.origin.includes("http")
      ? window.location.origin
      : "http://localhost:8000";

    document.getElementById("api-base").textContent = API_BASE;

    const statusEl = document.getElementById("status");
    const nodeForm = document.getElementById("node-form");
    const edgeForm = document.getElementById("edge-form");
    const sourceSelect = document.getElementById("source-id");
    const targetSelect = document.getElementById("target-id");
    const relSelect = document.getElementById("relationship-type");
    const relHint = document.getElementById("rel-hint");
    const edgeSubmit = document.getElementById("edge-submit");

    let relDescriptions = {};

    function showStatus(message, kind = "info") {
      statusEl.textContent = message;
      statusEl.className = `status-bar visible ${kind === "ok" ? "ok" : kind === "err" ? "err" : "info"}`;
    }

    function clearStatus() {
      statusEl.className = "status-bar";
      statusEl.textContent = "";
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...options.headers },
        ...options,
      });
      let body = null;
      const text = await res.text();
      if (text) {
        try { body = JSON.parse(text); } catch { body = { detail: text }; }
      }
      if (!res.ok) {
        const detail = body?.detail;
        const msg = Array.isArray(detail)
          ? detail.map((d) => d.msg || JSON.stringify(d)).join("; ")
          : typeof detail === "string"
            ? detail
            : detail
              ? JSON.stringify(detail)
              : `Request failed (${res.status})`;
        throw new Error(msg);
      }
      return body;
    }

    function fillNodeSelects(nodes) {
      const opts = nodes.length
        ? nodes.map((n) => `<option value="${n.id}">${escapeHtml(n.title)}</option>`).join("")
        : "";
      const placeholder = '<option value="">— no nodes yet —</option>';
      sourceSelect.innerHTML = `<option value="">— select source —</option>${opts}`;
      targetSelect.innerHTML = `<option value="">— select target —</option>${opts}`;
      edgeSubmit.disabled = nodes.length < 2;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    async function loadNodes() {
      const nodes = await api("/api/nodes");
      fillNodeSelects(nodes);
      return nodes;
    }

    async function loadOntology() {
      const data = await api("/api/ontology/relationship-types");
      relDescriptions = data.descriptions || {};
      relSelect.innerHTML =
        '<option value="">— select type —</option>' +
        (data.allowed_types || [])
          .map((t) => `<option value="${t}">${t}</option>`)
          .join("");
    }

    relSelect.addEventListener("change", () => {
      const key = relSelect.value;
      relHint.textContent = relDescriptions[key] || "";
    });

    nodeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      const btn = document.getElementById("node-submit");
      btn.disabled = true;
      try {
        const payload = {
          title: document.getElementById("title").value.trim(),
          excerpt: document.getElementById("excerpt").value.trim(),
          summary: document.getElementById("summary").value.trim(),
          source_metadata: document.getElementById("source").value.trim(),
        };
        const result = await api("/api/nodes", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showStatus(`Node created: “${result.title}” (${result.node_id})`, "ok");
        nodeForm.reset();
        await loadNodes();
      } catch (err) {
        showStatus(err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    edgeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      const sourceId = sourceSelect.value;
      const targetId = targetSelect.value;
      if (sourceId === targetId) {
        showStatus("Source and target must be different nodes.", "err");
        return;
      }
      const btn = edgeSubmit;
      btn.disabled = true;
      try {
        const payload = {
          source_id: sourceId,
          target_id: targetId,
          relationship_type: relSelect.value,
        };
        const result = await api("/api/edges", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showStatus(
          `Edge created: ${result.connection} → ${result.source_id.slice(0, 8)}… → ${result.target_id.slice(0, 8)}…`,
          "ok"
        );
        edgeForm.reset();
        relHint.textContent = "";
      } catch (err) {
        showStatus(err.message, "err");
      } finally {
        const nodes = await loadNodes().catch(() => []);
        edgeSubmit.disabled = nodes.length < 2;
      }
    });

    async function init() {
      try {
        const health = await api("/health");
        if (health.neo4j === "connected") {
          showStatus("Connected to Neo4j.", "info");
          await Promise.all([loadOntology(), loadNodes()]);
        } else {
          showStatus(
            "API is running but Neo4j is unreachable. Start your database in Neo4j Desktop, then refresh this page.",
            "err"
          );
          await loadOntology();
        }
      } catch (err) {
        showStatus(
          `Cannot reach API at ${API_BASE}. Start the server: uv run uvicorn main:app --reload`,
          "err"
        );
      }
    }

    init();
  </script>
</body>
</html>
