<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internalize — Human Linker</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --input: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #deff9a;
      --accent-dim: #a8c97a;
      --danger: #f87171;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    header p {
      margin-top: 0.35rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .status-bar {
      margin-top: 1rem;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      display: none;
      border: 1px solid transparent;
    }

    .status-bar.ok {
      display: block;
      background: rgba(222, 255, 154, 0.08);
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .status-bar.err {
      display: block;
      background: rgba(248, 113, 113, 0.08);
      border-color: #991b1b;
      color: var(--danger);
    }

    .status-bar.info {
      display: block;
      background: rgba(148, 163, 184, 0.1);
      border-color: var(--border);
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
    }

    .panel.node-panel { border-top: 2px solid var(--accent); }
    .panel.edge-panel { border-top: 2px solid var(--accent-dim); }

    .panel h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .panel .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .field { margin-bottom: 1rem; }

    .field label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field textarea {
      min-height: 120px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 2px rgba(222, 255, 154, 0.15);
    }

    optgroup {
      color: var(--accent);
      font-weight: 600;
      font-style: normal;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
      background: var(--accent);
      color: #0f172a;
      transition: opacity 0.15s, transform 0.1s;
    }

    button[type="submit"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button[type="submit"]:not(:disabled):active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    footer span { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Internalize</h1>
      <p>MVP 1 — The Human Linker · Input Pane</p>
      <div id="status" class="status-bar" role="status" aria-live="polite"></div>
    </header>

    <div class="grid">
      <section class="panel node-panel">
        <h2>Capture Node</h2>
        <p class="subtitle">The Triplet — density, title, content.</p>
        <form id="node-form">
          <div class="field">
            <label for="density-level">Density Level</label>
            <select id="density-level" name="density_level" required>
              <option value="3">Level 3: Source</option>
              <option value="2">Level 2: Excerpt</option>
              <option value="1">Level 1: Summary</option>
            </select>
          </div>
          <div class="field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required placeholder="e.g. System 1 vs System 2" />
          </div>
          <div class="field">
            <label for="content">Content</label>
            <textarea id="content" name="content" required placeholder="Raw text for this density level…"></textarea>
          </div>
          <button type="submit" id="node-submit">Save Node</button>
        </form>
      </section>

      <section class="panel edge-panel">
        <h2>Create Semantic Edge</h2>
        <p class="subtitle">Link two concepts with a strict relationship type. ◌ = ingested raw material.</p>
        <form id="edge-form">
          <div class="field">
            <label for="source-id">Source Node</label>
            <select id="source-id" name="source_id" required>
              <option value="">— select source —</option>
            </select>
          </div>
          <div class="field">
            <label for="relationship-type">Relationship Type</label>
            <select id="relationship-type" name="relationship_type" required>
              <option value="">— select type —</option>
            </select>
          </div>
          <div class="field">
            <label for="target-id">Target Node</label>
            <select id="target-id" name="target_id" required>
              <option value="">— select target —</option>
            </select>
          </div>
          <button type="submit" id="edge-submit" disabled>Create Edge</button>
        </form>
      </section>
    </div>

    <footer>API · <span id="api-base"></span></footer>
  </div>

  <script>
    const API_BASE = window.location.origin.includes("http")
      ? window.location.origin
      : "http://127.0.0.1:8000";

    const DENSITY_LABELS = { 1: "Summary", 2: "Excerpt", 3: "Source" };

    document.getElementById("api-base").textContent = API_BASE;

    const statusEl = document.getElementById("status");
    const nodeForm = document.getElementById("node-form");
    const edgeForm = document.getElementById("edge-form");
    const sourceSelect = document.getElementById("source-id");
    const targetSelect = document.getElementById("target-id");
    const relSelect = document.getElementById("relationship-type");
    const edgeSubmit = document.getElementById("edge-submit");

    function showStatus(message, kind = "info") {
      statusEl.textContent = message;
      statusEl.className = `status-bar ${kind === "ok" ? "ok" : kind === "err" ? "err" : "info"}`;
    }

    function clearStatus() {
      statusEl.className = "status-bar";
      statusEl.textContent = "";
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...options.headers },
        ...options,
      });
      let body = null;
      const text = await res.text();
      if (text) {
        try { body = JSON.parse(text); } catch { body = { detail: text }; }
      }
      if (!res.ok) {
        const detail = body?.detail;
        const msg = Array.isArray(detail)
          ? detail.map((d) => d.msg || JSON.stringify(d)).join("; ")
          : typeof detail === "string"
            ? detail
            : detail
              ? JSON.stringify(detail)
              : `Request failed (${res.status})`;
        throw new Error(msg);
      }
      return body;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function nodeLabel(node) {
      const level = DENSITY_LABELS[node.density_level] || `L${node.density_level}`;
      const prefix = node.origin === "ingest" ? "◌ " : "";
      return `${prefix}${node.title} (L${node.density_level}: ${level})`;
    }

    function fillNodeSelects(nodes) {
      const opts = nodes.length
        ? nodes.map((n) => `<option value="${n.id}">${escapeHtml(nodeLabel(n))}</option>`).join("")
        : "";
      sourceSelect.innerHTML = `<option value="">— select source —</option>${opts}`;
      targetSelect.innerHTML = `<option value="">— select target —</option>${opts}`;
      edgeSubmit.disabled = nodes.length < 2;
    }

    async function loadNodes() {
      const nodes = await api("/api/nodes");
      fillNodeSelects(nodes);
      return nodes;
    }

    function fillRelationshipSelect(axes) {
      relSelect.innerHTML = '<option value="">— select type —</option>';
      for (const [axis, types] of Object.entries(axes)) {
        const group = document.createElement("optgroup");
        group.label = axis;
        for (const type of types) {
          const opt = document.createElement("option");
          opt.value = type;
          opt.textContent = type;
          group.appendChild(opt);
        }
        relSelect.appendChild(group);
      }
    }

    async function loadOntology() {
      const data = await api("/api/ontology/relationship-types");
      fillRelationshipSelect(data.axes || {});
    }

    nodeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      const btn = document.getElementById("node-submit");
      btn.disabled = true;
      try {
        const payload = {
          title: document.getElementById("title").value.trim(),
          content: document.getElementById("content").value.trim(),
          density_level: parseInt(document.getElementById("density-level").value, 10),
          significance: 1.0,
          origin: "human",
        };
        const result = await api("/api/nodes", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showStatus(`Node saved: “${result.title}” (L${result.density_level})`, "ok");
        nodeForm.reset();
        await loadNodes();
      } catch (err) {
        showStatus(err.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    edgeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearStatus();
      const sourceId = sourceSelect.value;
      const targetId = targetSelect.value;
      if (sourceId === targetId) {
        showStatus("Source and target must be different nodes.", "err");
        return;
      }
      edgeSubmit.disabled = true;
      try {
        const payload = {
          source_id: sourceId,
          target_id: targetId,
          relationship_type: relSelect.value,
          strength: 1.0,
          origin: "human",
        };
        const result = await api("/api/edges", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        showStatus(`Edge created: ${result.connection}`, "ok");
        edgeForm.reset();
      } catch (err) {
        showStatus(err.message, "err");
      } finally {
        const nodes = await loadNodes().catch(() => []);
        edgeSubmit.disabled = nodes.length < 2;
      }
    });

    async function init() {
      try {
        const health = await api("/health");
        await loadOntology();
        if (health.neo4j === "connected") {
          showStatus("Connected to Neo4j.", "info");
          await loadNodes();
        } else {
          showStatus(
            "API is running but Neo4j is unreachable. Start Neo4j Desktop, then refresh.",
            "err"
          );
        }
      } catch (err) {
        showStatus(
          `Cannot reach API at ${API_BASE}. Start: uv run uvicorn main:app --reload`,
          "err"
        );
      }
    }

    init();
  </script>
</body>
</html>
