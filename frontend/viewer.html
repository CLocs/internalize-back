    function clearDocSearchMarks() {
      docBody.querySelectorAll("mark.doc-search-match").forEach((mark) => {
        const parent = mark.parentNode;
        while (mark.firstChild) {
          parent.insertBefore(mark.firstChild, mark);
        }
        parent.removeChild(mark);
      });
      docBody.normalize();
      docSearchMatches = [];
      currentSearchIndex = -1;
    }

    function updateDocSearchCounter() {
      if (docSearchMatches.length === 0 || currentSearchIndex < 0) {
        docSearchCounter.textContent = `0/${docSearchMatches.length}`;
        return;
      }
      docSearchCounter.textContent = `${currentSearchIndex + 1}/${docSearchMatches.length}`;
    }

    function scrollActiveSearchIntoView(activeMark) {
      scrollElementInPane(activeMark, { block: "center", behavior: "smooth" });
      repositionDocumentCanvasLines();
      const scrollEnd = Date.now() + 800;
      const tick = () => {
        repositionDocumentCanvasLines();
        if (Date.now() < scrollEnd) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function setActiveSearchMatch(index) {
      docSearchMatches.forEach((mark) => mark.classList.remove("doc-search-active"));

      if (index < 0 || index >= docSearchMatches.length) {
        currentSearchIndex = -1;
        updateDocSearchCounter();
        return;
      }

      currentSearchIndex = index;
      const activeMark = docSearchMatches[index];
      activeMark.classList.add("doc-search-active");
      updateDocSearchCounter();
      scrollActiveSearchIntoView(activeMark);
    }

    function wrapTextNodeMatches(textNode, query) {
      const text = textNode.nodeValue;
      const lowerText = text.toLowerCase();
      const lowerQuery = query.toLowerCase();
      const fragments = [];
      let lastIndex = 0;
      let idx = lowerText.indexOf(lowerQuery);

      while (idx !== -1) {
        if (idx > lastIndex) {
          fragments.push(document.createTextNode(text.slice(lastIndex, idx)));
        }
        const mark = document.createElement("mark");
        mark.className = "doc-search-match";
        mark.textContent = text.slice(idx, idx + query.length);
        fragments.push(mark);
        lastIndex = idx + query.length;
        idx = lowerText.indexOf(lowerQuery, lastIndex);
      }

      if (lastIndex === 0) return;

      if (lastIndex < text.length) {
        fragments.push(document.createTextNode(text.slice(lastIndex)));
      }

      const parent = textNode.parentNode;
      fragments.forEach((fragment) => parent.insertBefore(fragment, textNode));
      parent.removeChild(textNode);
    }

    function performDocSearch(query) {
      clearDocSearchMarks();
      const trimmed = query.trim();
      if (!trimmed) {
        updateDocSearchCounter();
        return;
      }

      const textNodes = [];
      const walker = document.createTreeWalker(docBody, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (node.parentElement?.closest("mark.doc-search-match")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        },
      });

      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      for (let i = textNodes.length - 1; i >= 0; i -= 1) {
        wrapTextNodeMatches(textNodes[i], trimmed);
      }

      docSearchMatches = Array.from(docBody.querySelectorAll("mark.doc-search-match"));
      if (docSearchMatches.length > 0) {
        setActiveSearchMatch(0);
      } else {
        updateDocSearchCounter();
      }
    }

    function goToSearchMatch(direction) {
      if (docSearchMatches.length === 0) return;

      if (currentSearchIndex < 0) {
        setActiveSearchMatch(direction >= 0 ? 0 : docSearchMatches.length - 1);
        return;
      }

      const nextIndex =
        (currentSearchIndex + direction + docSearchMatches.length) % docSearchMatches.length;
      setActiveSearchMatch(nextIndex);
    }

    function clearDocSearch() {
      docSearchInput.value = "";
      clearDocSearchMarks();
      updateDocSearchCounter();
    }

    function initDocSearchListeners() {
      if (docSearchInput.dataset.bound) return;
      docSearchInput.dataset.bound = "1";

      docSearchInput.addEventListener("input", () => {
        clearTimeout(docSearchDebounceTimer);
        docSearchDebounceTimer = setTimeout(() => {
          performDocSearch(docSearchInput.value);
        }, 300);
      });

      docSearchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          goToSearchMatch(1);
        }
      });

      docSearchPrev.addEventListener("click", () => goToSearchMatch(-1));
      docSearchNext.addEventListener("click", () => goToSearchMatch(1));
      docSearchClear.addEventListener("click", clearDocSearch);
    }

    function buildHighlightedHtml(text, excerpts) {
      const matches = excerpts
        .map((e) => ({ id: e.id, content: e.content, idx: text.indexOf(e.content) }))
        .filter((m) => m.idx >= 0)
        .sort((a, b) => a.idx - b.idx);

      let html = "";
      let cursor = 0;
      for (const m of matches) {
        if (m.idx < cursor) continue;
        html += escapeHtml(text.slice(cursor, m.idx));
        html += `<span id="excerpt-${m.id}" class="excerpt-highlight">${escapeHtml(m.content)}</span>`;
        cursor = m.idx + m.content.length;
      }
      html += escapeHtml(text.slice(cursor));
      return html;
    }

    function getWorkspaceCard(nodeId) {
      return WorkspaceDomCache.getCard(nodeId);
    }

    function sourceDocumentLabel(source) {
      const isSynthesis = source.density_level === 4 || source.node_type === "Document";
      const kind = isSynthesis ? "Synthesis" : "Book";
      return `${source.title} (${kind})`;
    }

    async function loadSourceLibrary(selectedId = null) {
      try {
        const res = await fetch(`${API_BASE}/api/sources`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to load source library");
        }
        const sources = await res.json();
        if (sources.length === 0) {
          sourceSelector.innerHTML = '<option value="">No sources yet</option>';
          collapseSynthesisPane();
          return sources;
        }
        sourceSelector.innerHTML = sources
          .map(
            (s) =>
              `<option value="${escapeHtml(s.id)}">${escapeHtml(sourceDocumentLabel(s))}</option>`
          )
          .join("");
        const targetId = selectedId || documentCanvasSourceId || sources[0].id;
        suppressSourceChange = true;
        if (targetId) sourceSelector.value = targetId;
        suppressSourceChange = false;
        return sources;
      } catch (err) {
        sourceSelector.innerHTML = '<option value="">Failed to load</option>';
        showStatus(err.message, true);
        return [];
      }
    }

    function initSourceSelector() {
      if (sourceSelector.dataset.bound) return;
      sourceSelector.dataset.bound = "1";
      sourceSelector.addEventListener("change", () => {
        if (suppressSourceChange) return;
        const sourceId = sourceSelector.value;
        if (sourceId) initDocumentCanvas(sourceId);
      });
    }

    function generateTimestampTitle() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return (
        `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-` +
        `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`
      );
    }

    function setSynthesisTitleToTimestamp() {
      if (synthesisTitleInput) {
        synthesisTitleInput.value = generateTimestampTitle();
      }
    }

    function clearSynthesisWorkspace() {
      activeSynthesisDocId = null;
      synthesisDropzone?.replaceChildren();
      if (synthesisComposer) synthesisComposer.innerHTML = "";
      setSynthesisTitleToTimestamp();
    }

    function gatherSynthesisReferencedNodeIds() {
      const ids = new Set();

      synthesisDropzone?.querySelectorAll(".synthesis-item[data-source-node]").forEach((item) => {
        const nodeId = item.dataset.sourceNode?.trim();
        if (nodeId) ids.add(nodeId);
      });

      if (activeSynthesisDocId) ids.delete(activeSynthesisDocId);
      return [...ids];
    }

    async function syncSynthesisReferenceEdges(docId, referencedNodeIds) {
      if (!docId || referencedNodeIds.length === 0) return;

      const responses = await Promise.all(
        referencedNodeIds.map((targetId) =>
          fetch(`${API_BASE}/api/edges`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_id: docId,
              target_id: targetId,
              relationship_type: "REFERENCES",
              strength: 1.0,
              origin: "human",
            }),
          })
        )
      );

      for (const res of responses) {
        if (res.ok) continue;
        const body = await res.json().catch(() => ({}));
        const detail = body.detail;
        throw new Error(
          typeof detail === "string"
            ? detail
            : `Failed to create REFERENCES edge (HTTP ${res.status})`
        );
      }
    }

    function flashSynthesisSavedBadge() {
      if (!synthesisSavedBadge) return;
      synthesisSavedBadge.classList.add("visible");
      if (flashSynthesisSavedBadge._timer) {
        clearTimeout(flashSynthesisSavedBadge._timer);
      }
      flashSynthesisSavedBadge._timer = window.setTimeout(() => {
        synthesisSavedBadge.classList.remove("visible");
      }, 2000);
    }

    function gatherSynthesisPaneText() {
      const sections = [];

      synthesisDropzone?.querySelectorAll(".synthesis-item").forEach((item) => {
        const nodeId = item.dataset.sourceNode?.trim();
        const meta = item.querySelector(".synthesis-item-meta-label")?.textContent?.trim();
        const text = item.querySelector(".synthesis-item-text")?.textContent?.trim();
        if (!text) return;
        if (nodeId && meta) {
          sections.push(`[${meta} · ${nodeId}]\n${text}`);
        } else {
          sections.push(text);
        }
      });

      const composerText = synthesisComposer?.innerText.trim();
      if (composerText) sections.push(composerText);

      return sections.join("\n\n");
    }

    async function saveSynthesis() {
      const content = gatherSynthesisPaneText();
      if (!content) {
        showStatus("Synthesis workspace is empty. Add content before saving.", true);
        return false;
      }

      let trimmedTitle = synthesisTitleInput?.value.trim() || "";
      if (!trimmedTitle) {
        trimmedTitle = generateTimestampTitle();
        if (synthesisTitleInput) synthesisTitleInput.value = trimmedTitle;
      }

      const referencedNodeIds = gatherSynthesisReferencedNodeIds();
      const isCreate = !activeSynthesisDocId;

      saveSynthesisBtn.disabled = true;
      try {
        let docId = activeSynthesisDocId;

        if (isCreate) {
          const res = await fetch(`${API_BASE}/api/nodes`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: trimmedTitle,
              content,
              density_level: 4,
              node_type: "Document",
              significance: 1.0,
              origin: "human",
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to create synthesis document");
          }
          const result = await res.json();
          docId = result.node_id;
          activeSynthesisDocId = docId;
        } else {
          const res = await fetch(`${API_BASE}/api/nodes/${encodeURIComponent(docId)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: trimmedTitle,
              content,
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to update synthesis document");
          }
        }

        await syncSynthesisReferenceEdges(docId, referencedNodeIds);
        await loadSourceLibrary(documentCanvasSourceId || docId);

        if (isCreate && documentCanvasSourceId !== docId) {
          showStatus(`Created synthesis document: “${trimmedTitle}”`);
        } else if (documentCanvasSourceId === docId) {
          await initDocumentCanvas(docId);
          showStatus(`Updated synthesis document: “${trimmedTitle}”`);
        } else {
          showStatus(`Saved synthesis document: “${trimmedTitle}”`);
        }

        return true;
      } catch (err) {
        showStatus(err.message, true);
        return false;
      } finally {
        saveSynthesisBtn.disabled = false;
      }
    }

    async function saveSynthesisToGraph() {
      return saveSynthesis();
    }

    function removeExcerptHighlightFromDoc(nodeId) {
      const span = document.getElementById(`excerpt-${nodeId}`);
      if (!span) return;
      const parent = span.parentNode;
      while (span.firstChild) {
        parent.insertBefore(span.firstChild, span);
      }
      parent.removeChild(span);
      parent.normalize();
    }

    function purgeNodeFromSummaryMaps(nodeId) {
      summaryChildMap.delete(nodeId);
      hierarchyChildMap.delete(nodeId);
      for (const map of [summaryChildMap, hierarchyChildMap]) {
        for (const [parentId, childIds] of map.entries()) {
          const filtered = childIds.filter((id) => id !== nodeId);
          if (filtered.length !== childIds.length) {
            map.set(parentId, filtered);
            if (map === summaryChildMap) {
              const parentCard = getWorkspaceCard(parentId);
              if (parentCard) {
                if (filtered.length) {
                  parentCard.dataset.childIds = filtered.join(",");
                } else {
                  parentCard.removeAttribute("data-childIds");
                }
              }
            }
          }
        }
      }
      nodeColumnMap.delete(nodeId);
      workspaceNodeMap.delete(nodeId);
      workspaceNodeOrder.delete(nodeId);
      flowCollapsedBranches.delete(nodeId);
    }

    function removeAllLeaderLinesForNode(nodeId) {
      ConnectionManager.removeEdgesForNode(nodeId);
    }

    async function deleteNode(nodeId) {
      const card = getWorkspaceCard(nodeId);
      const label =
        card?.querySelector(".card-title")?.textContent?.trim() ||
        card?.querySelector(".card-content")?.textContent?.trim().slice(0, 60) ||
        nodeId;

      if (!confirm(`Delete “${label}” and remove its connections?`)) return;

      try {
        const res = await fetch(`${API_BASE}/api/nodes/${encodeURIComponent(nodeId)}`, {
          method: "DELETE",
        });
        if (!res.ok && res.status !== 204) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to delete node");
        }

        removeAllLeaderLinesForNode(nodeId);
        removeExcerptHighlightFromDoc(nodeId);
        purgeNodeFromSummaryMaps(nodeId);

        selectedCardIds = selectedCardIds.filter((id) => id !== nodeId);
        WorkspaceDomCache.unregisterCard(nodeId);
        card?.remove();

        syncPromoteButtons();
        updateGroupSynthesizeButton();
        refreshFlowViewIfActive();
        repositionDocumentCanvasLines();
        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    function attachCardDeleteButton(card, nodeId) {
      let menu = card.querySelector(".card-hover-menu");
      if (!menu) {
        menu = document.createElement("div");
        menu.className = "card-hover-menu";
        card.appendChild(menu);
      }
      if (menu.querySelector(".card-delete-btn")) return;

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "card-delete-btn";
      deleteBtn.title = "Delete node";
      deleteBtn.textContent = "×";
      deleteBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        deleteNode(nodeId);
      });
      menu.appendChild(deleteBtn);
    }

    function isSummaryDensity(densityLevel) {

    function applyWorkspaceViewMode(mode) {
      workspaceViewMode = mode;
      viewTreeBtn.classList.toggle("active", mode === "tree");
      viewFlowBtn.classList.toggle("active", mode === "flow");

      applyShowNodeLabels(defaultShowNodeLabelsForView(mode));
      setConnectionMode(mode === "flow" ? "none" : "active");

      ConnectionManager.clearAll();
      reconcileView(mode);

      synthesisDropzone?.querySelectorAll(".synthesis-item").forEach((item) => {
        applySynthesisItemIndent(item);
      });

      requestAnimationFrame(() => {
        scheduleDrawConnections();
      });
    }

    function applyCardTreeIndent(card) {
      clearFlowIndentClasses(card);
      const depth = parseInt(card.dataset.depthLevel, 10) || 0;
      if (workspaceViewMode === "tree") {
        card.style.marginLeft = `${depth * 20}px`;
        card.style.width = "";
        card.style.maxWidth = "";
        card.style.marginRight = "";
      } else {
        card.style.marginLeft = "";
        card.style.width = "";
        card.style.maxWidth = "";
        card.style.marginRight = "";
      }
    }

    function getSynthesisItemMetaLabel(nodeId) {
      const node = workspaceNodeMap.get(nodeId);
      if (!node) return "Node";
      if (node.density_level === 1) return "Summary";
      if (node.density_level === 2) return "Excerpt";
      return "Source";
    }

    function applySynthesisItemIndent(item) {
      const depth = parseInt(item.dataset.depthLevel, 10) || 0;
      if (workspaceViewMode === "tree") {
        item.style.marginLeft = `${depth * 20}px`;
      } else {
        item.style.marginLeft = "";
      }
    }

    function getWorkspaceCardText(card) {
      const contentEl = card.querySelector(".card-content");
      if (contentEl) return contentEl.textContent.trim();
      const titleEl = card.querySelector(".card-title");
      if (titleEl) return titleEl.textContent.trim();
      return card.textContent.trim();
    }

    function jumpToSourceNode(nodeId) {
      if (!nodeId) return;
      const card = getWorkspaceCard(nodeId);
      if (!card) {
        showStatus(`Source node ${nodeId} not found in workspace.`, true);
        return;
      }

      const column = card.closest(".workspace-column");
      if (column) {
        scrollElementInPane(column, {
          container: workspaceColumns,
          behavior: "smooth",
          inline: "nearest",
          block: "nearest",
        });
      }

      card.classList.remove("workspace-focus", "trace-highlight");
      void card.offsetWidth;
      card.classList.add("workspace-focus", "trace-highlight");
      scrollElementInPane(card, { behavior: "smooth", block: "center" });

      if (card.dataset.sourceSpan) {
        const span = document.getElementById(card.dataset.sourceSpan);
        if (span) {
          scrollElementInPane(span, { behavior: "smooth", block: "center" });
          span.classList.add("trace-highlight");
        }
      } else if (card.classList.contains("summary-card")) {
        handleWorkspaceCardTrace(card);
      }

      repositionDocumentCanvasLines();
      const scrollEnd = Date.now() + 800;
      const tick = () => {
        repositionDocumentCanvasLines();
        if (Date.now() < scrollEnd) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

      setTimeout(() => {
        card.classList.remove("workspace-focus");
      }, 2000);
    }

    function appendSynthesisItem(nodeId, text, depthLevel) {
      if (!synthesisDropzone) return null;

      const item = document.createElement("div");
      item.className = "synthesis-item";
      item.dataset.sourceNode = nodeId;
      item.dataset.depthLevel = String(depthLevel ?? 0);

      const handle = document.createElement("button");
      handle.type = "button";
      handle.className = "drag-handle";
      handle.setAttribute("aria-label", "Drag to reorder");
      handle.title = "Drag to reorder";
      handle.textContent = "⋮⋮";

      const body = document.createElement("div");
      body.className = "synthesis-item-body";

      const meta = document.createElement("div");
      meta.className = "synthesis-item-meta";

      const metaLabel = document.createElement("span");
      metaLabel.className = "synthesis-item-meta-label";
      metaLabel.textContent = getSynthesisItemMetaLabel(nodeId);

      const anchor = document.createElement("button");
      anchor.type = "button";
      anchor.className = "source-link-anchor";
      anchor.title = "Jump to source node";
      anchor.dataset.nodeId = nodeId;
      anchor.textContent = "⛓";
      anchor.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        jumpToSourceNode(nodeId);
      });

      const textEl = document.createElement("div");
      textEl.className = "synthesis-item-text";
      textEl.textContent = text;

      meta.appendChild(metaLabel);
      meta.appendChild(anchor);
      body.appendChild(meta);
      body.appendChild(textEl);
      item.appendChild(handle);
      item.appendChild(body);

      synthesisDropzone.appendChild(item);
      applySynthesisItemIndent(item);
      scrollElementInPane(item, { behavior: "smooth", block: "nearest" });
      return item;
    }

    function getNodeById(nodeId) {
      if (!nodeId) return null;
      const cached = workspaceNodeMap.get(nodeId);
      if (cached) return { ...cached, id: nodeId };

      const card = getWorkspaceCard(nodeId);
      if (!card) return null;

      const densityLevel = parseInt(card.dataset.densityLevel, 10);
      const title = card.querySelector(".card-title")?.textContent?.trim() || "";
      const content = getWorkspaceCardText(card);

      return {
        id: nodeId,
        title,
        content,
        density_level: Number.isFinite(densityLevel) ? densityLevel : getCardDepthLevel(nodeId),
        origin: card.classList.contains("ingest") ? "ingest" : "human",
      };
    }

    function onWorkspaceCardDragStart(e, card, nodeId) {
      const text = getWorkspaceCardText(card);
      const depthLevel = parseInt(card.dataset.depthLevel, 10);
      const payload = {
        nodeId,
        text,
        depthLevel: Number.isFinite(depthLevel) ? depthLevel : getCardDepthLevel(nodeId),
      };
      e.dataTransfer.setData("application/x-internalize-node", JSON.stringify(payload));
      e.dataTransfer.setData("text/plain", nodeId);
      e.dataTransfer.effectAllowed = "copy";
      card.classList.add("is-dragging", "dragging");
    }

    function initSynthesisDropzoneSortable() {
      if (!synthesisDropzone || synthesisDropzone.dataset.sortableBound) return;
      if (typeof Sortable === "undefined") return;
      synthesisDropzone.dataset.sortableBound = "1";

      new Sortable(synthesisDropzone, {
        animation: 150,
        ghostClass: "synthesis-ghost",
        handle: ".drag-handle",
        draggable: ".synthesis-item",
        onEnd() {
          // DOM order updated; persist on explicit save via saveSynthesis()
        },
      });
    }

    function initPaneRecoveryHandles() {
      if (synthesisPaneHandle && !synthesisPaneHandle.dataset.bound) {
        synthesisPaneHandle.dataset.bound = "1";
        synthesisPaneHandle.addEventListener("click", () => expandSynthesisPane());
      }
      if (graphPaneHandle && !graphPaneHandle.dataset.bound) {
        graphPaneHandle.dataset.bound = "1";
        graphPaneHandle.addEventListener("click", () => setWorkspaceGraphCollapsed(false));
      }
      updatePaneRecoveryHandles();
    }

    function initSynthesisPaneCollapse() {
      if (synthesisCollapseHandle.dataset.bound) return;
      synthesisCollapseHandle.dataset.bound = "1";

      synthesisCollapseHandle.addEventListener("click", () => {
        if (synthesisPaneCollapsed) expandSynthesisPane();
        else collapseSynthesisPane();
      });

      synthesisPaneShell.addEventListener("transitionend", (e) => {
        if (e.propertyName !== "width") return;
        repositionDocumentCanvasLines();
        if (cy) {
          try { cy.resize(); } catch (_) { /* not initialized */ }
        }
      });
    }

    function initSynthesisTitleAndSave() {
      if (document.getElementById("synthesis-pane")?.dataset.titleSaveBound) return;
      document.getElementById("synthesis-pane").dataset.titleSaveBound = "1";

      if (!synthesisTitleInput?.value.trim()) {
        setSynthesisTitleToTimestamp();
      }

      newNoteBtn?.addEventListener("click", () => {
        activeSynthesisDocId = null;
        clearSynthesisWorkspace();
      });

      saveSynthesisBtn?.addEventListener("click", async () => {
        const saved = await saveSynthesis();
        if (saved) flashSynthesisSavedBadge();
      });

      synthesisComposer?.addEventListener("keydown", (e) => {
        if (!(e.ctrlKey || e.metaKey) || e.key !== "Enter") return;
        e.preventDefault();
        saveSynthesis().then((saved) => {
          if (saved) flashSynthesisSavedBadge();
        });
      });
    }

    function bindSynthesisDropzoneDnD() {
      if (!synthesisDropzone || synthesisDropzone.dataset.dndBound) return;
      synthesisDropzone.dataset.dndBound = "1";

      synthesisDropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        synthesisDropzone.classList.add("drag-over");
      });

      synthesisDropzone.addEventListener("dragleave", (e) => {
        if (!synthesisDropzone.contains(e.relatedTarget)) {
          synthesisDropzone.classList.remove("drag-over");
        }
      });

      synthesisDropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        synthesisDropzone.classList.remove("drag-over");

        const raw = e.dataTransfer.getData("application/x-internalize-node");
        if (!raw) return;

        try {
          const { nodeId, text, depthLevel } = JSON.parse(raw);
          if (!text) return;
          appendSynthesisItem(nodeId, text, depthLevel);
        } catch (_) {
          showStatus("Could not read dropped card data.", true);
        }
      });

      synthesisDropzone.addEventListener("click", (e) => {
        const anchor = e.target.closest(".source-link-anchor");
        if (!anchor) return;
        e.preventDefault();
        jumpToSourceNode(anchor.dataset.nodeId);
      });
    }

    function initSynthesisPane() {
      initSynthesisPaneCollapse();
      initPaneRecoveryHandles();
      initSynthesisDropzoneSortable();
      initSynthesisTitleAndSave();
      bindSynthesisDropzoneDnD();
    }

    function initWorkspaceViewToggle() {
      if (viewTreeBtn.dataset.bound) return;
      viewTreeBtn.dataset.bound = "1";
      initFlowScrollAnchoring();

      viewTreeBtn.addEventListener("click", () => applyWorkspaceViewMode("tree"));
      viewFlowBtn.addEventListener("click", () => applyWorkspaceViewMode("flow"));
      applyWorkspaceViewMode("tree");
    }

    function buildSummaryChildMapFromEdges(edges) {
      const map = new Map();
      for (const edge of edges) {
        const parentId = edge.source_id;
        const childId = edge.target_id;
        if (!map.has(parentId)) map.set(parentId, []);
        const childIds = map.get(parentId);
        if (!childIds.includes(childId)) childIds.push(childId);
      }
      return map;
    }

    function addHierarchyChild(parentId, childId) {
      if (!parentId || !childId || parentId === childId) return;
      if (!hierarchyChildMap.has(parentId)) hierarchyChildMap.set(parentId, []);
      const childIds = hierarchyChildMap.get(parentId);
      if (!childIds.includes(childId)) childIds.push(childId);
    }

    function buildHierarchyChildMap(summaryEdges, sourceId, excerptIds) {
      const map = new Map();
      const addChild = (parentId, childId) => {
        if (!parentId || !childId || parentId === childId) return;
        if (!map.has(parentId)) map.set(parentId, []);
        const childIds = map.get(parentId);
        if (!childIds.includes(childId)) childIds.push(childId);
      };

      if (sourceId) {
        for (const excerptId of excerptIds) {
          addChild(sourceId, excerptId);
        }
      }

      for (const edge of summaryEdges) {
        addChild(edge.source_id, edge.target_id);
      }

      return map;
    }

    function getHierarchyChildren(nodeId) {
      return hierarchyChildMap.get(nodeId) || [];
    }

    function getFlowRootIds() {
      const summarizedChildIds = new Set();
      for (const childIds of summaryChildMap.values()) {
        for (const childId of childIds) summarizedChildIds.add(childId);
      }

      const roots = [];
      for (const nodeId of workspaceNodeMap.keys()) {
        if (!summarizedChildIds.has(nodeId)) roots.push(nodeId);
      }

      roots.sort((a, b) => {
        const ao = workspaceNodeOrder.get(a) ?? 0;
        const bo = workspaceNodeOrder.get(b) ?? 0;
        return ao - bo;
      });
      return roots;
    }

    function clearFlowIndentClasses(card) {
      for (let i = 0; i <= MAX_FLOW_INDENT_CLASS; i += 1) {
        card.classList.remove(`flow-indent-${i}`);
      }
      card.removeAttribute("data-flow-depth");
      card.style.marginLeft = "";
      card.style.width = "";
      card.style.maxWidth = "";
      card.style.paddingLeft = "";
    }

    function clearFlowOutlineChrome(card) {
      card.querySelector(".flow-fold-btn")?.remove();
      card.classList.remove("flow-has-children", "flow-branch-collapsed", "flow-hidden");
    }

    function applyFlowIndent(card, depth) {
      clearFlowIndentClasses(card);
      card.dataset.flowDepth = String(depth);
      const indentPx = depth * FLOW_INDENT_STEP;
      card.style.marginLeft = `${indentPx}px`;
      if (indentPx > 0) {
        card.style.width = `calc(100% - ${indentPx}px)`;
        card.style.maxWidth = `${FLOW_CARD_MAX_WIDTH - indentPx}px`;
      } else {
        card.style.width = "100%";
        card.style.maxWidth = `${FLOW_CARD_MAX_WIDTH}px`;
      }
    }

    function getFlowScrollAnchor() {
      const flowColumn = WorkspaceDomCache.flowColumn?.isConnected
        ? WorkspaceDomCache.flowColumn
        : document.getElementById("col-flow");
      if (!flowColumn) return null;

      const containerRect = workspaceColumns.getBoundingClientRect();
      const cards = flowColumn.querySelectorAll(".workspace-card:not(.flow-hidden)");
      for (const card of cards) {
        const rect = card.getBoundingClientRect();
        if (rect.bottom <= containerRect.top) continue;
        const nodeId = card.dataset.nodeId || card.id?.replace("workspace-card-", "");
        if (!nodeId) break;
        return {
          nodeId,
          offsetTop: rect.top - containerRect.top,
          fallbackScrollTop: workspaceColumns.scrollTop,
        };
      }

      return { fallbackScrollTop: workspaceColumns.scrollTop };
    }

    function restoreFlowScrollAnchor(anchor) {
      if (!anchor || workspaceViewMode !== "flow") return;
      if (!WorkspaceDomCache.flowColumn?.isConnected) return;

      if (anchor.nodeId) {
        const card = getWorkspaceCard(anchor.nodeId);
        if (card) {
          const containerRect = workspaceColumns.getBoundingClientRect();
          const cardRect = card.getBoundingClientRect();
          const delta = (cardRect.top - containerRect.top) - anchor.offsetTop;
          workspaceColumns.scrollTop += delta;
          return;
        }
      }

      if (Number.isFinite(anchor.fallbackScrollTop)) {
        workspaceColumns.scrollTop = anchor.fallbackScrollTop;
      }
    }

    function initFlowScrollAnchoring() {
      if (flowResizeObserver) return;
      flowResizeObserver = new ResizeObserver(() => {
        if (workspaceViewMode !== "flow" || !pendingFlowScrollAnchor) return;
        restoreFlowScrollAnchor(pendingFlowScrollAnchor);
        pendingFlowScrollAnchor = null;
      });
      flowResizeObserver.observe(nodePane);
    }

    function toggleFlowBranch(nodeId) {
      pendingFlowScrollAnchor = getFlowScrollAnchor();
      if (flowCollapsedBranches.has(nodeId)) {
        flowCollapsedBranches.delete(nodeId);
      } else {
        flowCollapsedBranches.add(nodeId);
      }
      refreshFlowViewIfActive();
      requestAnimationFrame(() => {
        if (!pendingFlowScrollAnchor) return;
        restoreFlowScrollAnchor(pendingFlowScrollAnchor);
        pendingFlowScrollAnchor = null;
      });
    }

    function ensureFlowFoldButton(card, nodeId, hasChildren) {
      if (!hasChildren) {
        card.querySelector(".flow-fold-btn")?.remove();
        card.classList.remove("flow-has-children", "flow-branch-collapsed");
        return;
      }

      let btn = card.querySelector(".flow-fold-btn");
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flow-fold-btn";
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          toggleFlowBranch(nodeId);
        });
        card.insertBefore(btn, card.firstChild);
      }

      const collapsed = flowCollapsedBranches.has(nodeId);
      btn.setAttribute("aria-label", collapsed ? "Expand branch" : "Collapse branch");
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.textContent = collapsed ? "▶" : "▼";
      card.classList.add("flow-has-children");
      card.classList.toggle("flow-branch-collapsed", collapsed);
    }

    function getFlowChildren(nodeId) {
      return (summaryChildMap.get(nodeId) || [])
        .slice()
        .sort((a, b) => (workspaceNodeOrder.get(a) ?? 0) - (workspaceNodeOrder.get(b) ?? 0));
    }

    function ensureFlowColumn() {
      if (WorkspaceDomCache.flowColumn?.isConnected) {
        return WorkspaceDomCache.flowColumn;
      }
      let col = document.getElementById("col-flow");
      if (!col) {
        col = document.createElement("div");
        col.id = "col-flow";
        col.className = "density-column workspace-column flow-column";
        col.dataset.columnIndex = "flow";
        workspaceColumns.insertBefore(col, groupSynthesizeBtn);
        if (!col.dataset.scrollBound) {
          col.addEventListener("scroll", repositionDocumentCanvasLines);
          col.dataset.scrollBound = "1";
        }
      }
      WorkspaceDomCache.flowColumn = col;
      return col;
    }

    function renderFlow(nodeId, depth, visited, ancestorCollapsed = false) {
      if (visited.has(nodeId)) return;
      visited.add(nodeId);

      const card = getWorkspaceCard(nodeId);
      if (!card || !workspaceNodeMap.has(nodeId)) return;

      const children = getFlowChildren(nodeId);
      applyFlowIndent(card, depth);
      ensureFlowFoldButton(card, nodeId, children.length > 0);
      ensureFlowColumn().appendChild(card);
      card.classList.toggle("flow-hidden", ancestorCollapsed);
      const currentCollapsed = flowCollapsedBranches.has(nodeId);

      for (const childId of children) {
        try {
          renderFlow(childId, depth + 1, visited, ancestorCollapsed || currentCollapsed);
        } catch (err) {
          console.error(`[renderFlow] Stopped at child ${childId}:`, err);
          break;
        }
      }
    }

    function reconcileFlowLayout() {
      if (!documentCanvasSourceId || workspaceNodeMap.size === 0) return;

      ensureFlowColumn();
      const visited = new Set();
      const roots = getFlowRootIds();

      try {
        for (const rootId of roots) {
          renderFlow(rootId, 0, visited);
        }
      } catch (err) {
        console.error("[reconcileView] Flow hierarchy render failed:", err);
      }
    }

    function reconcileTreeLayout() {
      const columnIndices = new Set([1]);
      for (const columnIndex of nodeColumnMap.values()) columnIndices.add(columnIndex);
      for (const columnIndex of columnIndices) {
        const col = getWorkspaceColumn(columnIndex);
        WorkspaceDomCache.registerColumn(columnIndex, col);
      }

      const nodeIds = [...workspaceNodeMap.keys()].sort(
        (a, b) => (workspaceNodeOrder.get(a) ?? 0) - (workspaceNodeOrder.get(b) ?? 0)
      );
      for (const nodeId of nodeIds) {
        const card = getWorkspaceCard(nodeId);
        if (!card) continue;
        clearFlowIndentClasses(card);
        clearFlowOutlineChrome(card);
        applyCardTreeIndent(card);
        appendToColumn(nodeColumnMap.get(nodeId) || 1, card);
      }
    }

    function reconcileView(viewType) {
      WorkspaceDomCache.cacheFromDom();

      nodePane.classList.toggle("view-tree", viewType === "tree");
      nodePane.classList.toggle("view-flow", viewType === "flow");

      try {
        if (viewType === "flow") {
          reconcileFlowLayout();
        } else {
          reconcileTreeLayout();
        }
      } catch (err) {
        console.error(`[reconcileView] Failed switching to ${viewType}:`, err);
      }
    }

    function refreshFlowViewIfActive() {
      if (workspaceViewMode !== "flow") return;
      ConnectionManager.clearAll();
      reconcileFlowLayout();
      scheduleDrawConnections();
    }

    function computeSummaryColumnForChildren(childIds) {
      if (!childIds.length) return 2;
      return Math.max(...childIds.map((id) => getCardColumnIndex(id))) + 1;
    }

    function assignNodeColumn(nodeId, columnIndex) {
      nodeColumnMap.set(nodeId, columnIndex);
      const card = getWorkspaceCard(nodeId);
      if (card) {
        card.dataset.columnIndex = String(columnIndex);
        card.dataset.depthLevel = String(Math.max(0, columnIndex - 1));
      }
    }

    async function refreshWorkspaceAfterGraphMutation() {
      reconcileView(workspaceViewMode);
      if (documentCanvasSourceId) {
        try {
          await loadWorkspaceCyGraph(documentCanvasSourceId);
        } catch (err) {
          console.error("[refreshWorkspaceAfterGraphMutation]", err);
        }
      }
      requestAnimationFrame(() => {
        ConnectionManager.drawAllConnections();
        repositionDocumentCanvasLines();
      });
    }

    function computeNodeColumns(excerptIds, summaryEdges) {
      const columns = new Map();
      for (const id of excerptIds) {
        columns.set(id, 1);
      }

      let changed = true;
      while (changed) {
        changed = false;
        for (const edge of summaryEdges) {
          const childCol = columns.get(edge.target_id);
          if (childCol === undefined) continue;
          const parentCol = childCol + 1;
          const existing = columns.get(edge.source_id);
          if (existing === undefined || parentCol > existing) {
            columns.set(edge.source_id, parentCol);
            changed = true;
          }
        }
      }
      return columns;
    }

    function getCardColumnIndex(nodeId) {
      const card = getWorkspaceCard(nodeId);
      if (card?.dataset.columnIndex) {
        return parseInt(card.dataset.columnIndex, 10);
      }
      return nodeColumnMap.get(nodeId) || 1;
    }

    function getSynthesisTargetColumn(selectedIds) {
      if (selectedIds.length === 0) return 2;
      const maxCol = Math.max(...selectedIds.map((id) => getCardColumnIndex(id)));
      return maxCol + 1;
    }

    function getSummaryCardHtml(node) {
      const title = (node.title ?? "").trim();
      const body = (node.content ?? node.text ?? "").trim();
      const heading = title || body || "Untitled";
      const showBody = Boolean(body && body !== title);

      return `
        <div class="card-label node-label">Level 1: Summary</div>
        <div class="card-title">${escapeHtml(heading)}</div>
        ${showBody ? `<div class="card-content">${escapeHtml(body)}</div>` : ""}
      `;
    }

    function applyCardPresentation(card, node) {
      const isSummary = isSummaryDensity(node.density_level);
      card.classList.toggle("summary-card", isSummary);
      card.classList.toggle("excerpt-card", !isSummary);
      card.dataset.densityLevel = String(node.density_level);

      if (isSummary) {
        card.innerHTML = getSummaryCardHtml(node);
      } else {
        card.dataset.sourceSpan = `excerpt-${node.id}`;
        card.innerHTML = `
          <div class="card-label node-label">Level 2: Excerpt</div>
          <div class="card-content">${escapeHtml(node.content)}</div>
        `;
      }
    }

    function bindWorkspaceCardInteractions(card, nodeId) {
      card.draggable = true;
      card.addEventListener("dragstart", (e) => onWorkspaceCardDragStart(e, card, nodeId));
      card.addEventListener("dragend", () => card.classList.remove("is-dragging", "dragging"));

      card.addEventListener("click", (e) => {
        if (e.target.closest(".promote-btn, .card-delete-btn")) return;

        if (e.altKey) {
          e.preventDefault();
          e.stopPropagation();
          if (SelectionManager.addNodeFromCard(nodeId)) {
            flashWorkbenchAdded(card);
          }
          return;
        }

        SelectionManager.setActiveNode(nodeId);
        if (e.ctrlKey || e.metaKey || e.shiftKey) {
          e.preventDefault();
          e.stopPropagation();
          toggleCardSelection(nodeId, card);
          return;
        }
        handleWorkspaceCardTrace(card);
      });
    }

    function createWorkspaceCard(node, columnIndex) {
      const card = document.createElement("div");
      card.id = `workspace-card-${node.id}`;
      card.className = "workspace-card";
      card.dataset.nodeId = node.id;
      card.dataset.columnIndex = String(columnIndex);
      card.dataset.depthLevel = String(Math.max(0, columnIndex - 1));
      if (node.origin === "ingest") card.classList.add("ingest");

      const childIds = summaryChildMap.get(node.id) || [];
      if (childIds.length) card.dataset.childIds = childIds.join(",");

      applyCardPresentation(card, node);
      bindWorkspaceCardInteractions(card, node.id);
      attachCardDeleteButton(card, node.id);
      nodeColumnMap.set(node.id, columnIndex);
      applyCardTreeIndent(card);
      WorkspaceDomCache.registerCard(node.id, card);
      return card;
    }

    function getWorkspaceColumn(columnIndex) {
      return ensureWorkspaceColumn(columnIndex, `col-${columnIndex}`);
    }

    function ensureWorkspaceColumn(columnIndex, columnId) {
      let col = document.getElementById(columnId);
      if (!col) {
        col = document.createElement("div");
        col.id = columnId;
        col.className = "density-column workspace-column";
        col.dataset.columnIndex = String(columnIndex);
        insertColumnInOrder(col, columnIndex);
        if (!col.dataset.scrollBound) {
          col.addEventListener("scroll", repositionDocumentCanvasLines);
          col.dataset.scrollBound = "1";
        }
      }
      WorkspaceDomCache.registerColumn(columnIndex, col);
      return col;
    }

    function insertColumnInOrder(col, columnIndex) {
      const existing = [...workspaceColumns.querySelectorAll(".workspace-column")];
      const insertBefore = existing.find(
        (c) => parseInt(c.dataset.columnIndex, 10) > columnIndex
      );
      workspaceColumns.insertBefore(col, insertBefore || groupSynthesizeBtn);
    }

    function resetWorkspaceColumns() {
      workspaceColumns.querySelectorAll(".workspace-column").forEach((col) => {
        col.remove();
      });
      workspaceColumns.querySelectorAll(".inline-editor").forEach((el) => {
        el.remove();
      });
      WorkspaceDomCache.clearColumnsOnly();
      WorkspaceDomCache.cards.clear();
      ensureWorkspaceColumn(1, "col-1");
    }

    function appendToColumn(columnIndex, element) {
      getWorkspaceColumn(columnIndex).appendChild(element);
    }

    function clearGroupingSelection() {
      selectedCardIds = [];
      nodePane.querySelectorAll(".workspace-card.selected-for-grouping").forEach((card) => {
        card.classList.remove("selected-for-grouping");
      });
      syncPromoteButtons();
      updateGroupSynthesizeButton();
    }

    function syncPromoteButtons() {
      nodePane.querySelectorAll(".workspace-card .promote-btn").forEach((btn) => btn.remove());
      for (const id of selectedCardIds) {
        const card = getWorkspaceCard(id);
        if (!card || card.querySelector(".promote-btn")) continue;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "promote-btn";
        btn.textContent = "⬆ Promote";
        card.appendChild(btn);
      }
    }

    function toggleCardSelection(nodeId, card) {
      const idx = selectedCardIds.indexOf(nodeId);
      if (idx >= 0) {
        selectedCardIds.splice(idx, 1);
        card.classList.remove("selected-for-grouping");
      } else {
        selectedCardIds.push(nodeId);
        card.classList.add("selected-for-grouping");
      }
      syncPromoteButtons();
      updateGroupSynthesizeButton();
    }

    function updateGroupSynthesizeButton() {
      const count = selectedCardIds.length;
      groupSynthesizeBtn.style.display = count > 0 ? "block" : "none";
      groupSynthesizeBtn.textContent = `Synthesize Group (${count})`;
    }

    function deduplicateNodesById(nodes) {
      const seen = new Set();
      const unique = [];
      for (const node of nodes) {
        if (seen.has(node.id)) continue;
        seen.add(node.id);
        unique.push(node);
      }
      return unique;
    }

    function renderWorkspaceCards(excerpts, summaries, summaryEdges) {
      lastWorkspaceRender = { excerpts, summaries, summaryEdges };
      workspaceNodeMap = new Map();
      workspaceNodeOrder = new Map();
      let order = 0;
      for (const excerpt of deduplicateNodesById(excerpts)) {
        workspaceNodeMap.set(excerpt.id, excerpt);
        workspaceNodeOrder.set(excerpt.id, order++);
      }
      for (const summary of deduplicateNodesById(summaries)) {
        if (!workspaceNodeMap.has(summary.id)) {
          workspaceNodeMap.set(summary.id, summary);
          workspaceNodeOrder.set(summary.id, order++);
        }
      }

      summaryChildMap = buildSummaryChildMapFromEdges(summaryEdges);
      hierarchyChildMap = buildHierarchyChildMap(
        summaryEdges,
        documentCanvasSourceId,
        excerpts.map((e) => e.id)
      );
      nodeColumnMap = computeNodeColumns(
        excerpts.map((e) => e.id),
        summaryEdges
      );
      resetWorkspaceColumns();
      clearGroupingSelection();

      for (const excerpt of deduplicateNodesById(excerpts)) {
        const columnIndex = nodeColumnMap.get(excerpt.id) || 1;
        const card = createWorkspaceCard(excerpt, columnIndex);
        appendToColumn(columnIndex, card);
      }

      const excerptIds = new Set(excerpts.map((e) => e.id));
      for (const summary of deduplicateNodesById(summaries)) {
        if (excerptIds.has(summary.id)) continue;
        const columnIndex = nodeColumnMap.get(summary.id) || 2;
        const card = createWorkspaceCard(summary, columnIndex);
        appendToColumn(columnIndex, card);
      }

      ConnectionManager.clearAll();
      reconcileView(workspaceViewMode);
      scheduleDrawConnections();
    }

    function mergeSummaryChildren(parentId, childIds) {
      const existing = summaryChildMap.get(parentId) || [];
      const merged = [...existing];
      for (const childId of childIds) {
        if (!merged.includes(childId)) merged.push(childId);
        addHierarchyChild(parentId, childId);
      }
      summaryChildMap.set(parentId, merged);
      const parentCard = getWorkspaceCard(parentId);
      if (parentCard) parentCard.dataset.childIds = merged.join(",");
    }

    function applyPromotedSummaryStyle(card, nodeId, childIds) {
      const content = card.querySelector(".card-content")?.textContent.trim() || "";
      const title = excerptTitle(content);
      const sourceSpan = card.dataset.sourceSpan;
      const node = {
        id: nodeId,
        title,
        content,
        density_level: 1,
      };

      card.classList.remove("selected-for-grouping");
      card.dataset.densityLevel = "1";
      mergeSummaryChildren(nodeId, childIds);
      card.querySelector(".promote-btn")?.remove();
      applyCardPresentation(card, node);
      if (sourceSpan) card.dataset.sourceSpan = sourceSpan;
      attachCardDeleteButton(card, nodeId);
      applyCardTreeIndent(card);
    }

    async function promoteCardToParent(parentId) {
      const childIds = selectedCardIds.filter((id) => id !== parentId);
      if (childIds.length === 0) {
        showStatus("Select at least one other card to promote under this parent.", true);
        return;
      }

      const parentCard = getWorkspaceCard(parentId);
      if (!parentCard) return;

      const parentDensity = parseInt(parentCard.dataset.densityLevel, 10);

      try {
        if (parentDensity === 2) {
          const putRes = await fetch(`${API_BASE}/api/nodes/${encodeURIComponent(parentId)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ density_level: 1 }),
          });
          if (!putRes.ok) {
            const body = await putRes.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to promote node");
          }
        }

        for (const childId of childIds) {
          const edgeRes = await fetch(`${API_BASE}/api/edges`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_id: parentId,
              target_id: childId,
              relationship_type: "SUMMARIZES",
              strength: 1.0,
              origin: "human",
            }),
          });
          if (!edgeRes.ok) {
            const body = await edgeRes.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to create edge");
          }
        }

        applyPromotedSummaryStyle(parentCard, parentId, childIds);

        const promotedTitle =
          parentCard.querySelector(".card-title")?.textContent?.trim() ||
          excerptTitle(parentCard.querySelector(".card-content")?.textContent?.trim() || "");
        const promotedContent = parentCard.querySelector(".card-content")?.textContent?.trim() || "";
        const existingNode = workspaceNodeMap.get(parentId) || { id: parentId, origin: "human" };
        workspaceNodeMap.set(parentId, {
          ...existingNode,
          id: parentId,
          title: promotedTitle,
          content: promotedContent,
          density_level: 1,
        });

        const newColumn = computeSummaryColumnForChildren(childIds);
        assignNodeColumn(parentId, newColumn);

        nodePane.querySelectorAll(".workspace-card.selected-for-grouping").forEach((card) => {
          card.classList.remove("selected-for-grouping");
          card.querySelector(".promote-btn")?.remove();
        });
        selectedCardIds = [];
        updateGroupSynthesizeButton();

        for (const childId of childIds) {
          ConnectionManager.registerEdge({
            id: ConnectionManager.edgeKey("SUMMARIZES", parentId, childId),
            source_id: parentId,
            target_id: childId,
            relationship_type: "SUMMARIZES",
          });
        }

        await refreshWorkspaceAfterGraphMutation();

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    function isSelectionInsideDocBody(selection) {
      if (!selection.rangeCount) return false;
      const range = selection.getRangeAt(0);
      const container = range.commonAncestorContainer;
      const el = container.nodeType === Node.TEXT_NODE ? container.parentElement : container;
      return el && docBody.contains(el);
    }

    function unwrapPendingExtraction() {
      const pending = document.getElementById("pending-extraction");
      if (!pending) return;
      const parent = pending.parentNode;
      while (pending.firstChild) {
        parent.insertBefore(pending.firstChild, pending);
      }
      parent.removeChild(pending);
      parent.normalize();
    }

    function wrapSelectionInPendingSpan(range) {
      unwrapPendingExtraction();
      const span = document.createElement("span");
      span.id = "pending-extraction";

      try {
        range.surroundContents(span);
      } catch (_) {
        const fragment = range.extractContents();
        span.appendChild(fragment);
        range.insertNode(span);
      }

      return span;
    }

    function findParentExcerptId(element) {
      let current = element;
      while (current && current !== docBody) {
        if (current.id && current.id.startsWith("excerpt-")) {
          return current.id.slice("excerpt-".length);
        }
        current = current.parentElement;
      }
      return null;
    }

    function removeCanvasInlineEditor() {
      nodePane.querySelectorAll(".inline-editor").forEach((el) => el.remove());
    }

    function bindEditorSaveHotkey(textarea, saveBtn) {
      textarea.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          saveBtn.click();
        }
      });
    }

    function openCanvasInlineEditor(selectedText, anchorSpan) {
      removeCanvasInlineEditor();

      const template = document.getElementById("inline-editor-template");
      const editor = template.content.firstElementChild.cloneNode(true);
      const textarea = editor.querySelector("textarea");
      const densitySelect = editor.querySelector(".editor-density");
      const saveBtn = editor.querySelector(".editor-save");
      const cancelBtn = editor.querySelector(".editor-cancel");

      textarea.value = selectedText;
      densitySelect.value = "2";

      cancelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        unwrapPendingExtraction();
        editor.remove();
      });

      saveBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await saveCanvasExtraction(editor, textarea, densitySelect, saveBtn, anchorSpan);
      });

      bindEditorSaveHotkey(textarea, saveBtn);

      appendToColumn(1, editor);
      scrollElementInPane(editor, { behavior: "smooth", block: "nearest" });
      textarea.focus();
    }

    function getConcatenatedCardTexts(cardIds) {
      const selectedTexts = [];
      for (const id of cardIds) {
        const card = getWorkspaceCard(id);
        if (!card) continue;
        const text = getWorkspaceCardText(card);
        if (text) selectedTexts.push(text);
      }
      return selectedTexts.join("\n\n");
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function openGroupSynthesisEditor() {
      removeCanvasInlineEditor();
      groupSynthesizeBtn.style.display = "none";

      const template = document.getElementById("inline-editor-template");
      const editor = template.content.firstElementChild.cloneNode(true);
      editor.dataset.groupSynthesis = "1";
      const textarea = editor.querySelector("textarea");
      const densitySelect = editor.querySelector(".editor-density");
      const saveBtn = editor.querySelector(".editor-save");
      const cancelBtn = editor.querySelector(".editor-cancel");

      densitySelect.value = "1";
      densitySelect.disabled = true;

      const groupedIds = [...selectedCardIds];
      const concatenatedText = getConcatenatedCardTexts(groupedIds);
      textarea.value = concatenatedText;
      autoResizeTextarea(textarea);

      cancelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        densitySelect.disabled = false;
        editor.remove();
        updateGroupSynthesizeButton();
      });

      saveBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await saveGroupSynthesis(editor, textarea, saveBtn, groupedIds);
      });

      bindEditorSaveHotkey(textarea, saveBtn);

      const targetColumn = getSynthesisTargetColumn(groupedIds);
      appendToColumn(targetColumn, editor);

      scrollElementInPane(editor, { behavior: "smooth", block: "nearest" });
      textarea.focus();
    }

    async function saveGroupSynthesis(editor, textarea, saveBtn, groupedCardIds) {
      const content = textarea.value.trim();
      if (!content) {
        showStatus("Content cannot be empty.", true);
        return;
      }
      if (groupedCardIds.length === 0) {
        showStatus("No cards selected for grouping.", true);
        return;
      }

      const title = excerptTitle(content);
      const targetColumn = getSynthesisTargetColumn(groupedCardIds);
      saveBtn.disabled = true;

      try {
        const nodeRes = await fetch(`${API_BASE}/api/nodes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            content,
            density_level: 1,
            significance: 1.0,
            origin: "human",
          }),
        });
        if (!nodeRes.ok) {
          const body = await nodeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create node");
        }
        const nodeData = await nodeRes.json();
        const summaryId = nodeData.node_id;

        for (const childId of groupedCardIds) {
          const edgeRes = await fetch(`${API_BASE}/api/edges`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_id: summaryId,
              target_id: childId,
              relationship_type: "SUMMARIZES",
              strength: 1.0,
              origin: "human",
            }),
          });
          if (!edgeRes.ok) {
            const body = await edgeRes.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to create edge");
          }
        }

        nodePane.querySelectorAll(".workspace-card.selected-for-grouping").forEach((card) => {
          card.classList.remove("selected-for-grouping");
        });
        selectedCardIds = [];
        syncPromoteButtons();
        updateGroupSynthesizeButton();

        summaryChildMap.set(summaryId, groupedCardIds);
        nodeColumnMap.set(summaryId, targetColumn);
        workspaceNodeMap.set(summaryId, {
          id: summaryId,
          title,
          content,
          density_level: 1,
          origin: "human",
        });
        workspaceNodeOrder.set(summaryId, workspaceNodeOrder.size);
        for (const childId of groupedCardIds) {
          addHierarchyChild(summaryId, childId);
        }

        const card = createWorkspaceCard({
          id: summaryId,
          title,
          content,
          density_level: 1,
          origin: "human",
        }, targetColumn);
        editor.replaceWith(card);

        for (const childId of groupedCardIds) {
          ConnectionManager.registerEdge({
            id: ConnectionManager.edgeKey("SUMMARIZES", summaryId, childId),
            source_id: summaryId,
            target_id: childId,
            relationship_type: "SUMMARIZES",
          });
        }

        await refreshWorkspaceAfterGraphMutation();

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
        saveBtn.disabled = false;
        updateGroupSynthesizeButton();
      }
    }

    async function saveCanvasExtraction(editor, textarea, densitySelect, saveBtn, anchorSpan) {
      const content = textarea.value.trim();
      if (!content) {
        showStatus("Content cannot be empty.", true);
        return;
      }
      if (!documentCanvasSourceId) {
        showStatus("Document source not loaded.", true);
        return;
      }

      const densityLevel = parseInt(densitySelect.value, 10);
      const title = excerptTitle(content);
      saveBtn.disabled = true;

      try {
        const nodeRes = await fetch(`${API_BASE}/api/nodes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            content,
            density_level: densityLevel,
            significance: 1.0,
            origin: "human",
          }),
        });
        if (!nodeRes.ok) {
          const body = await nodeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create node");
        }
        const nodeData = await nodeRes.json();
        const nodeId = nodeData.node_id;

        let edgePayload;
        let excerptIdForLine;

        if (densityLevel === 1) {
          excerptIdForLine = findParentExcerptId(anchorSpan);
          if (!excerptIdForLine) {
            throw new Error("Summaries must be extracted from within an excerpt highlight.");
          }
          edgePayload = {
            source_id: nodeId,
            target_id: excerptIdForLine,
            relationship_type: "SUMMARIZES",
            strength: 1.0,
            origin: "human",
          };
          unwrapPendingExtraction();
        } else {
          edgePayload = {
            source_id: documentCanvasSourceId,
            target_id: nodeId,
            relationship_type: "CONTAINS",
            strength: 1.0,
            origin: "human",
          };
          anchorSpan.id = `excerpt-${nodeId}`;
          anchorSpan.classList.add("excerpt-highlight");
          anchorSpan.removeAttribute("style");
          excerptIdForLine = nodeId;
        }

        const edgeRes = await fetch(`${API_BASE}/api/edges`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(edgePayload),
        });
        if (!edgeRes.ok) {
          const body = await edgeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create edge");
        }

        if (densityLevel === 1) {
          summaryChildMap.set(nodeId, [excerptIdForLine]);
          addHierarchyChild(nodeId, excerptIdForLine);
        } else {
          addHierarchyChild(documentCanvasSourceId, nodeId);
        }

        const columnIndex = densityLevel === 2 ? 1 : getCardColumnIndex(excerptIdForLine) + 1;
        nodeColumnMap.set(nodeId, columnIndex);
        workspaceNodeMap.set(nodeId, {
          id: nodeId,
          title,
          content,
          density_level: densityLevel,
          origin: "human",
        });
        workspaceNodeOrder.set(nodeId, workspaceNodeOrder.size);

        const card = createWorkspaceCard({
          id: nodeId,
          title,
          content,
          density_level: densityLevel,
          origin: "human",
        }, columnIndex);
        editor.replaceWith(card);
        if (!card.parentElement) {
          appendToColumn(columnIndex, card);
        }
        scrollElementInPane(card, { behavior: "smooth", block: "nearest" });

        if (densityLevel === 2) {
          ConnectionManager.registerEdge({
            id: ConnectionManager.edgeKey("CONTAINS", documentCanvasSourceId, nodeId),
            source_id: documentCanvasSourceId,
            target_id: nodeId,
            relationship_type: "CONTAINS",
          });
        } else {
          ConnectionManager.registerEdge({
            id: ConnectionManager.edgeKey("SUMMARIZES", nodeId, excerptIdForLine),
            source_id: nodeId,
            target_id: excerptIdForLine,
            relationship_type: "SUMMARIZES",
          });
        }

        await refreshWorkspaceAfterGraphMutation();

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
        saveBtn.disabled = false;
      }
    }

    function initGroupSynthesisListeners() {
      if (groupSynthesizeBtn.dataset.bound) return;
      groupSynthesizeBtn.dataset.bound = "1";
      groupSynthesizeBtn.addEventListener("click", openGroupSynthesisEditor);

      nodePane.addEventListener("click", (e) => {
        const promoteBtn = e.target.closest(".promote-btn");
        if (!promoteBtn) return;
        e.preventDefault();
        e.stopPropagation();
        const card = promoteBtn.closest(".workspace-card");
        const parentId = card?.dataset.nodeId;
        if (parentId) promoteCardToParent(parentId);
      });
    }

    async function autoSaveExcerptFromSelection(storedRange) {
      let range;
      let text;

      if (storedRange) {
        text = storedRange.toString().trim();
        if (!text || !isRangeInsideDocBody(storedRange)) return;
        range = storedRange.cloneRange();
      } else {
        const selection = window.getSelection();
        text = selection.toString().trim();
        if (!text || !isSelectionInsideDocBody(selection)) return;
        range = selection.getRangeAt(0).cloneRange();
      }

      if (!documentCanvasSourceId) {
        showStatus("Document source not loaded.", true);
        return;
      }

      const title = autoExcerptTitle(text);
      const content = text;
      const anchorSpan = wrapSelectionInPendingSpan(range);
      window.getSelection()?.removeAllRanges();

      try {
        const nodeRes = await fetch(`${API_BASE}/api/nodes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            content,
            density_level: 2,
            significance: 1.0,
            origin: "human",
          }),
        });
        if (!nodeRes.ok) {
          const body = await nodeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create excerpt");
        }
        const nodeData = await nodeRes.json();
        const nodeId = nodeData.node_id;

        const edgeRes = await fetch(`${API_BASE}/api/edges`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            source_id: documentCanvasSourceId,
            target_id: nodeId,
            relationship_type: "CONTAINS",
            strength: 1.0,
            origin: "human",
          }),
        });
        if (!edgeRes.ok) {
          const body = await edgeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to link excerpt to document");
        }

        anchorSpan.id = `excerpt-${nodeId}`;
        anchorSpan.classList.add("excerpt-highlight");
        anchorSpan.removeAttribute("style");

        addHierarchyChild(documentCanvasSourceId, nodeId);
        const columnIndex = 1;
        nodeColumnMap.set(nodeId, columnIndex);
        workspaceNodeMap.set(nodeId, {
          id: nodeId,
          title,
          content,
          density_level: 2,
          origin: "human",
        });
        workspaceNodeOrder.set(nodeId, workspaceNodeOrder.size);

        const card = createWorkspaceCard(
          { id: nodeId, title, content, density_level: 2, origin: "human" },
          columnIndex
        );
        appendToColumn(columnIndex, card);
        scrollElementInPane(card, { behavior: "smooth", block: "nearest" });

        ConnectionManager.registerEdge({
          id: ConnectionManager.edgeKey("CONTAINS", documentCanvasSourceId, nodeId),
          source_id: documentCanvasSourceId,
          target_id: nodeId,
          relationship_type: "CONTAINS",
        });

        await refreshWorkspaceAfterGraphMutation();
        flashExcerptSavedToast();
      } catch (err) {
        unwrapPendingExtraction();
        showStatus(err.message, true);
      }
    }

    function isRangeInsideDocBody(range) {
      const container = range.commonAncestorContainer;
      const el = container.nodeType === Node.TEXT_NODE ? container.parentElement : container;
      return el && docBody.contains(el);
    }

    function hideCustomContextMenu() {
      customContextMenu.style.display = "none";
      canvasContextMenuRange = null;
    }

    function initDocContextMenuListeners() {
      if (docPane.dataset.contextMenuBound) return;
      docPane.dataset.contextMenuBound = "1";

      docPane.addEventListener("contextmenu", (e) => {
        const selection = window.getSelection();
        const text = selection.toString().trim();
        if (!text || !isSelectionInsideDocBody(selection)) return;

        e.preventDefault();
        canvasContextMenuRange = selection.getRangeAt(0).cloneRange();
        customContextMenu.style.left = `${e.pageX}px`;
        customContextMenu.style.top = `${e.pageY}px`;
        customContextMenu.style.display = "block";
      });

      menuExtractBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const range = canvasContextMenuRange;
        hideCustomContextMenu();
        autoSaveExcerptFromSelection(range);
      });

      document.addEventListener("click", (e) => {
        if (!customContextMenu.contains(e.target)) {
          hideCustomContextMenu();
        }
      });
    }

    function focusDocumentCanvasTargets(summaryId, excerptId) {
      if (excerptId) {
        const span = document.getElementById(`excerpt-${excerptId}`);
        if (span) {
          span.classList.remove("excerpt-focus");
          void span.offsetWidth;
          span.classList.add("excerpt-focus");
          scrollElementInPane(span, { behavior: "smooth", block: "center" });
          setTimeout(() => span.classList.remove("excerpt-focus"), 2000);
        }
      }

      const card = getWorkspaceCard(summaryId);
      if (card) {
        card.classList.remove("workspace-focus");
        void card.offsetWidth;
        card.classList.add("workspace-focus");
        scrollElementInPane(card, { behavior: "smooth", block: "nearest" });
        setTimeout(() => card.classList.remove("workspace-focus"), 2000);
      }

      repositionDocumentCanvasLines();
      const scrollEnd = Date.now() + 800;
      const tick = () => {
        repositionDocumentCanvasLines();
        if (Date.now() < scrollEnd) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    async function initDocumentCanvas(sourceId = null) {
      clearDocumentCanvasLines();
      clearDocSearch();
      docBody.innerHTML = "";
      docTitle.textContent = "";
      nodePane.querySelectorAll(".workspace-column, .workspace-card, .inline-editor").forEach((el) => {
        el.remove();
      });
      WorkspaceDomCache.cards.clear();
      WorkspaceDomCache.clearColumnsOnly();

      try {
        const canvasUrl = sourceId
          ? `${API_BASE}/api/document-canvas?source_id=${encodeURIComponent(sourceId)}`
          : `${API_BASE}/api/document-canvas`;
        const res = await fetch(canvasUrl);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to load document canvas");
        }
        const data = await res.json();

        documentCanvasSourceId = data.source.id;
        await loadSourceLibrary(data.source.id);
        unwrapPendingExtraction();
        removeCanvasInlineEditor();

        docTitle.textContent = data.source.title;
        docBody.innerHTML = buildHighlightedHtml(data.document_text, data.excerpts);
        const summaryEdges = data.summary_edges || data.summaries.map((s) => ({
          source_id: s.id,
          target_id: s.excerpt_id,
        })).filter((e) => e.target_id);
        ConnectionManager.setGraphData(data.source.id, data.excerpts, summaryEdges);
        renderWorkspaceCards(data.excerpts, data.summaries, summaryEdges);

        requestAnimationFrame(() => {
          loadWorkspaceCyGraph(data.source.id);
        });

        initDocumentCanvasLineListeners();

        initDocSearchListeners();
        initGroupSynthesisListeners();
        initSynthesisPane();
        initWorkspaceViewToggle();
        applyWorkspaceViewMode(workspaceViewMode);
      } catch (err) {
        showStatus(err.message, true);
        collapseSynthesisPane();
      }
    }

    function isDocumentLoaded() {
      return Boolean(documentCanvasSourceId);
    }

    async function init() {
      initWorkspaceCyInstance();
      initDocContextMenuListeners();
      initGroupSynthesisListeners();
      initSynthesisPane();
      initShowNodeLabelsToggle();
      initWorkspaceViewToggle();
      initSourceSelector();
      initConnectionModeSelect();
      initWorkspaceGraphPane();
      initLeftPaneCollapses();
      initWorkbenchSidebar();

      if (!isDocumentLoaded()) {
        collapseSynthesisPane();
      }

      document.addEventListener("keydown", (e) => {
        if (!(e.ctrlKey || e.metaKey)) return;

        const key = e.key.toLowerCase();
        if (key === "f") {
          e.preventDefault();
          docSearchInput.focus();
          docSearchInput.select();
          return;
        }

        if (key === "e") {
          if (e.target.closest("textarea, input, select")) return;
          e.preventDefault();
          hideCustomContextMenu();
          autoSaveExcerptFromSelection();
        }
      });

      try {
        showStatus("Loading…");
        await initDocumentCanvas();
        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
        if (!isDocumentLoaded()) {
          collapseSynthesisPane();
        }
      }
    }

    init();
  </script>
  <div id="line-canvas" aria-hidden="true"></div>
</body>
</html>
