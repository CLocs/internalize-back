<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internalize — Spatial Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.7.4/dist/dagre.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leader-line/1.0.7/leader-line.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    body {
      display: flex;
      flex-direction: column;
    }

    #viewer-header {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.25rem;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    #viewer-header label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      white-space: nowrap;
    }

    #layout-toggle {
      min-width: 200px;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.875rem;
      cursor: pointer;
    }

    #layout-toggle:focus {
      outline: none;
      border-color: #deff9a;
    }

    #auto-trace-toggle {
      accent-color: #deff9a;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    #auto-trace-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #e2e8f0;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    #viewer-main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #cy { width: 100%; height: 100%; }
    #cy.hidden { display: none; }

    #document-canvas {
      display: none;
      flex-direction: row;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    #document-canvas.active { display: flex; }

    #macro-pane {
      width: 20%;
      border-right: 1px solid #334155;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }

    #macro-graph {
      width: 100%;
      height: 100%;
    }

    #macro-pane-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
      color: #64748b;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.75rem;
      pointer-events: none;
      z-index: 1;
    }

    #doc-pane {
      width: 40%;
      overflow-y: auto;
      padding: 0;
      border-right: 1px solid #334155;
    }

    #doc-search-bar {
      background: #1e293b;
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    #doc-search-input {
      flex-grow: 1;
      background: #0f172a;
      color: white;
      border: 1px solid #334155;
      padding: 5px 8px;
      border-radius: 4px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.85rem;
    }

    #doc-search-input:focus {
      outline: none;
      border-color: #475569;
    }

    #doc-search-counter {
      color: #94a3b8;
      font-size: 12px;
      min-width: 2.5rem;
      text-align: center;
      flex-shrink: 0;
    }

    #doc-search-bar button {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
    }

    #doc-search-bar button:hover {
      border-color: #475569;
      color: #deff9a;
    }

    .doc-pane-content {
      padding: 40px;
    }

    #doc-pane h1 {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.5rem;
      color: #deff9a;
      margin-bottom: 1.5rem;
    }

    #doc-pane .doc-body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.75;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .excerpt-highlight {
      background-color: rgba(222, 255, 154, 0.2);
      border-radius: 2px;
      scroll-margin: 80px;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .excerpt-highlight.excerpt-focus {
      animation: excerpt-pulse 0.6s ease-in-out 3;
    }

    @keyframes excerpt-pulse {
      0%, 100% { background-color: rgba(222, 255, 154, 0.2); box-shadow: none; }
      50% { background-color: rgba(222, 255, 154, 0.55); box-shadow: 0 0 14px rgba(222, 255, 154, 0.75); }
    }

    mark.doc-search-match {
      background-color: rgba(250, 204, 21, 0.35);
      color: inherit;
      border-radius: 2px;
      scroll-margin: 100px;
    }

    mark.doc-search-match.doc-search-active {
      background-color: #4ade80;
      color: #0f172a;
      outline: 2px solid #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
    }

    #node-pane {
      width: 40%;
      height: 100%;
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 40px;
      padding: 20px;
      align-items: flex-start;
      background: #0f172a;
    }

    .density-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 350px;
      width: 350px;
      flex-shrink: 0;
      max-height: 100%;
      overflow-y: auto;
    }

    .workspace-card {
      width: 100%;
      flex-shrink: 0;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-family: "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .workspace-card.ingest {
      opacity: 0.45;
    }

    .workspace-card.excerpt-card {
      border-left: 4px solid #94a3b8;
      position: relative;
    }

    .promote-btn {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: #deff9a;
      color: #0f172a;
      font-size: 10px;
      padding: 2px 5px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-weight: 600;
      z-index: 5;
    }

    .promote-btn:hover {
      filter: brightness(1.05);
    }

    .workspace-card.excerpt-card .card-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .workspace-card.excerpt-card .card-content {
      font-size: 0.75rem;
      line-height: 1.45;
      color: #cbd5e1;
      font-style: italic;
    }

    .workspace-card.summary-card {
      border-left: 4px solid #deff9a;
    }

    .workspace-card.summary-card .card-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #deff9a;
      margin-bottom: 0.35rem;
    }

    .workspace-card.summary-card .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      line-height: 1.35;
    }

    .workspace-card.summary-card .card-content {
      font-size: 0.8rem;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .workspace-card.workspace-focus {
      animation: card-pulse 0.6s ease-in-out 3;
      border-color: #deff9a;
    }

    .workspace-card.excerpt-card.workspace-focus {
      border-left-color: #deff9a;
    }

    .workspace-card.excerpt-card.selected-for-grouping {
      border: 2px solid #deff9a;
      border-left: 4px solid #deff9a;
      background: #273449;
    }

    .workspace-card.trace-highlight,
    .excerpt-highlight.trace-highlight {
      box-shadow: 0 0 15px #deff9a;
      transition: all 0.3s;
    }

    .workspace-card.excerpt-card.trace-highlight {
      border-left-color: #deff9a;
    }

    @keyframes card-pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35); }
      50% { box-shadow: 0 0 24px rgba(222, 255, 154, 0.65); }
    }

    #node-pane .hierarchy-card.inline-editor {
      width: 100%;
      flex-shrink: 0;
      cursor: default;
    }

    #group-synthesize-btn {
      display: none;
      position: sticky;
      bottom: 20px;
      align-self: flex-end;
      flex-shrink: 0;
      width: 350px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #deff9a;
      color: #0f172a;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 20;
      flex-shrink: 0;
    }

    #group-synthesize-btn:hover {
      filter: brightness(1.05);
    }

    #pending-extraction {
      background-color: rgba(222, 255, 154, 0.4);
      border-radius: 2px;
    }

    #custom-context-menu {
      display: none;
      position: absolute;
      z-index: 1000;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 5px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    #menu-extract-btn {
      color: #f8fafc;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 2px;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    #menu-extract-btn:hover {
      background: #334155;
    }

    .hierarchy-card.inline-editor {
      cursor: default;
      border-color: #deff9a;
      border-style: dashed;
    }

    .hierarchy-card.inline-editor textarea {
      width: 100%;
      min-height: 88px;
      margin-bottom: 0.65rem;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.85rem;
      resize: vertical;
    }

    .hierarchy-card.inline-editor select {
      width: 100%;
      margin-bottom: 0.65rem;
      padding: 0.45rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.85rem;
    }

    .editor-actions {
      display: flex;
      gap: 0.5rem;
    }

    .editor-actions button {
      flex: 1;
      padding: 0.45rem 0.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .editor-save {
      background: #deff9a;
      color: #0f172a;
    }

    .editor-cancel {
      background: #334155;
      color: #f8fafc;
    }

    #inline-editor-template {
      display: none;
    }

    .panel {
      position: fixed;
      left: 1rem;
      top: 72px;
      z-index: 90;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      font-family: "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    #controls { /* synthesis bridge panel — positioned below header */ }

    #synthesis-controls {
      min-width: 220px;
    }

    .panel label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
      margin-top: 0.65rem;
    }

    .panel label:first-child { margin-top: 0; }

    .panel select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .panel select:focus {
      outline: none;
      border-color: #deff9a;
    }

    #generate-bridge {
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.55rem 0.75rem;
      border: none;
      border-radius: 6px;
      background: #deff9a;
      color: #0f172a;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    #generate-bridge:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #status {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 0.875rem;
      color: #f8fafc;
      background: #1e293b;
      border: 1px solid #334155;
      z-index: 90;
      display: none;
    }
    #status.visible { display: block; }
    #status.error { color: #f87171; border-color: #991b1b; }
  </style>
</head>
<body>
  <header id="viewer-header">
    <label for="layout-toggle">Layout</label>
    <select id="layout-toggle">
      <option value="workspace" selected>N-Column Workspace</option>
      <option value="bridge">Synthesis Bridge</option>
      <option value="cose">Force Directed (Whiz-Bang)</option>
      <option value="dagre">Left-to-Right Tree</option>
    </select>
    <label id="auto-trace-label">
      <input type="checkbox" id="auto-trace-toggle" checked />
      Auto-Trace Backlinks
    </label>
  </header>

  <div id="synthesis-controls" class="panel" style="display: none;">
    <label for="node-a">Node A</label>
    <select id="node-a">
      <option value="">— select node A —</option>
    </select>
    <label for="node-b">Node B</label>
    <select id="node-b">
      <option value="">— select node B —</option>
    </select>
    <button type="button" id="generate-bridge">Generate Bridge</button>
  </div>

  <div id="status"></div>
  <div id="custom-context-menu">
    <div id="menu-extract-btn">Extract (Ctrl+E)</div>
  </div>

  <div id="viewer-main">
    <div id="cy"></div>
    <div id="document-canvas">
      <div id="macro-pane">
        <div id="macro-pane-empty">No summaries yet.</div>
        <div id="macro-graph"></div>
      </div>
      <div id="doc-pane">
        <div id="doc-search-bar">
          <input type="text" id="doc-search-input" placeholder="Search document..." />
          <span id="doc-search-counter">0/0</span>
          <button type="button" id="doc-search-prev" title="Previous match">▲</button>
          <button type="button" id="doc-search-next" title="Next match">▼</button>
          <button type="button" id="doc-search-clear" title="Clear search">✖</button>
        </div>
        <div class="doc-pane-content">
          <h1 id="doc-title"></h1>
          <div id="doc-body" class="doc-body"></div>
        </div>
      </div>
      <div id="node-pane">
        <button type="button" id="group-synthesize-btn">Synthesize Group (0)</button>
      </div>
    </div>
  </div>

  <template id="inline-editor-template">
    <div class="hierarchy-card inline-editor">
      <textarea placeholder="Write your summary or excerpt…"></textarea>
      <select class="editor-density">
        <option value="1">Level 1 · Summary</option>
        <option value="2" selected>Level 2 · Excerpt</option>
      </select>
      <div class="editor-actions">
        <button type="button" class="editor-save">Save</button>
        <button type="button" class="editor-cancel">Cancel</button>
      </div>
    </div>
  </template>

  <script>
    cytoscape.use(cytoscapeDagre);

    const API_BASE = window.location.origin.includes("http")
      ? window.location.origin
      : "http://127.0.0.1:8000";

    const statusEl = document.getElementById("status");
    const layoutToggle = document.getElementById("layout-toggle");
    const synthesisControls = document.getElementById("synthesis-controls");
    const nodeASelect = document.getElementById("node-a");
    const nodeBSelect = document.getElementById("node-b");
    const generateBridgeBtn = document.getElementById("generate-bridge");
    const cyContainer = document.getElementById("cy");
    const documentCanvas = document.getElementById("document-canvas");
    const macroGraphEl = document.getElementById("macro-graph");
    const macroPaneEmpty = document.getElementById("macro-pane-empty");
    const docPane = document.getElementById("doc-pane");
    const docSearchInput = document.getElementById("doc-search-input");
    const docSearchCounter = document.getElementById("doc-search-counter");
    const docSearchPrev = document.getElementById("doc-search-prev");
    const docSearchNext = document.getElementById("doc-search-next");
    const docSearchClear = document.getElementById("doc-search-clear");
    const docTitle = document.getElementById("doc-title");
    const docBody = document.getElementById("doc-body");
    const nodePane = document.getElementById("node-pane");
    const groupSynthesizeBtn = document.getElementById("group-synthesize-btn");
    const customContextMenu = document.getElementById("custom-context-menu");
    const menuExtractBtn = document.getElementById("menu-extract-btn");

    let cy = null;
    let fullGraphData = null;
    let documentLeaderLines = [];
    let macroCy = null;
    let macroCyTapHandler = null;
    let docSearchMatches = [];
    let currentSearchIndex = -1;
    let docSearchDebounceTimer = null;
    let documentCanvasSourceId = null;
    let canvasContextMenuRange = null;
    let selectedExcerptIds = [];
    let summaryChildMap = new Map();

    const macroCyStyles = [
      {
        selector: "node",
        style: {
          shape: "ellipse",
          width: 15,
          height: 15,
          "background-color": "#deff9a",
          color: "#e2e8f0",
          label: "data(title)",
          "font-size": 10,
          "text-valign": "bottom",
          "text-halign": "center",
          "text-margin-y": 6,
          "text-max-width": 80,
          "text-wrap": "ellipsis",
          "text-overflow-wrap": "anywhere",
        },
      },
      {
        selector: 'node[origin = "ingest"]',
        style: { opacity: 0.45 },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 2,
          "border-color": "#f8fafc",
        },
      },
      {
        selector: "edge",
        style: {
          width: 1,
          "curve-style": "bezier",
          "target-arrow-shape": "triangle",
          "line-color": "#475569",
          "target-arrow-color": "#475569",
          label: "data(label)",
          "font-size": 8,
          color: "#64748b",
        },
      },
    ];

    const DENSITY_LABELS = { 1: "Summary", 2: "Excerpt", 3: "Source" };

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function excerptTitle(text) {
      const line = text.split("\n", 1)[0].trim();
      if (line.length > 80) return line.slice(0, 77) + "...";
      return line || "Untitled";
    }

    function showStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = "visible" + (isError ? " error" : "");
    }

    function clearStatus() {
      statusEl.className = "";
      statusEl.textContent = "";
    }

    const cyStyles = [
      {
        selector: "node",
        style: {
          shape: "round-rectangle",
          width: 250,
          height: "label",
          padding: 15,
          "text-wrap": "wrap",
          "text-max-width": 220,
          "text-valign": "center",
          "text-halign": "center",
          "background-color": "#1e293b",
          color: "#f8fafc",
          "border-width": 1,
          "border-color": "#334155",
          label: "data(label)",
          "font-size": "11px",
          "line-height": 1.4,
        },
      },
      {
        selector: "node[density = 3]",
        style: {
          "border-color": "#deff9a",
          "border-width": 3,
        },
      },
      {
        selector: 'node[origin = "ingest"]',
        style: {
          opacity: 0.45,
        },
      },
      {
        selector: "edge",
        style: {
          "curve-style": "bezier",
          "target-arrow-shape": "triangle",
          label: "data(label)",
          "font-size": "10px",
          color: "#94a3b8",
          "line-color": "#475569",
          "target-arrow-color": "#475569",
          "text-rotation": "autorotate",
          "text-margin-y": -10,
        },
      },
    ];

    function unlockAllNodes() {
      if (cy) cy.nodes().unlock();
    }

    function runLayout(mode) {
      if (!cy) return;

      if (mode === "dagre") {
        cy.layout({ name: "dagre", rankDir: "LR", spacingFactor: 1.5, animate: true }).run();
      } else if (mode === "cose") {
        cy.layout({
          name: "cose",
          idealEdgeLength: 150,
          nodeOverlap: 50,
          animate: true,
          animationDuration: 500,
        }).run();
      }
    }

    function setGraphElements(data) {
      cy.elements().remove();
      cy.add(data);
    }

    async function loadGraph() {
      const res = await fetch(`${API_BASE}/api/graph`);
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `Failed to load graph (${res.status})`);
      }
      return res.json();
    }

    async function loadBridgeNodes() {
      const res = await fetch(`${API_BASE}/api/nodes`);
      if (!res.ok) throw new Error("Failed to load nodes for bridge picker");
      return res.json();
    }

    function nodeOptionLabel(node) {
      const level = node.density_level === 3 ? "Source" : "Summary";
      return `${node.title} (L${node.density_level}: ${level})`;
    }

    function fillBridgeSelects(nodes) {
      const bridgeNodes = nodes.filter((n) => n.density_level === 1 || n.density_level === 3);
      const opts = bridgeNodes
        .map((n) => `<option value="${n.id}">${nodeOptionLabel(n)}</option>`)
        .join("");
      nodeASelect.innerHTML = `<option value="">— select node A —</option>${opts}`;
      nodeBSelect.innerHTML = `<option value="">— select node B —</option>${opts}`;
      generateBridgeBtn.disabled = bridgeNodes.length < 2;
    }

    async function restoreFullGraph(mode) {
      if (!fullGraphData) return;
      unlockAllNodes();
      setGraphElements(fullGraphData);
      runLayout(mode);
    }

    async function generateBridge() {
      const sourceId = nodeASelect.value;
      const targetId = nodeBSelect.value;

      if (!sourceId || !targetId) {
        showStatus("Select both Node A and Node B.", true);
        return;
      }
      if (sourceId === targetId) {
        showStatus("Node A and Node B must be different.", true);
        return;
      }

      generateBridgeBtn.disabled = true;
      clearStatus();

      try {
        const res = await fetch(
          `${API_BASE}/api/bridge?source_id=${encodeURIComponent(sourceId)}&target_id=${encodeURIComponent(targetId)}`
        );
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Bridge request failed (${res.status})`);
        }

        const data = await res.json();
        unlockAllNodes();
        setGraphElements(data);

        const nodeA = cy.getElementById(sourceId);
        const nodeB = cy.getElementById(targetId);

        if (nodeA.empty() || nodeB.empty()) {
          throw new Error("Pinned nodes not found in bridge result.");
        }

        nodeA.position({ x: 100, y: cy.height() / 2 });
        nodeA.lock();
        nodeB.position({ x: cy.width() - 100, y: cy.height() / 2 });
        nodeB.lock();

        cy.layout({
          name: "cose",
          idealEdgeLength: 150,
          nodeOverlap: 50,
          animate: true,
          animationDuration: 500,
        }).run();

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
      } finally {
        generateBridgeBtn.disabled = false;
      }
    }

    function hideAllViewerPanels() {
      cyContainer.classList.add("hidden");
      documentCanvas.classList.remove("active");
      clearDocumentCanvasLines();
      destroyMacroCy();
      hideCustomContextMenu();
    }

    function destroyMacroCy() {
      if (macroCy) {
        if (macroCyTapHandler) {
          macroCy.off("tap", "node", macroCyTapHandler);
          macroCyTapHandler = null;
        }
        macroCy.destroy();
        macroCy = null;
      }
    }

    function clearDocumentCanvasLines() {
      documentLeaderLines.forEach((line) => {
        try { line.remove(); } catch (_) { /* already removed */ }
      });
      documentLeaderLines = [];
    }

    function repositionDocumentCanvasLines() {
      documentLeaderLines.forEach((line) => {
        try { line.position(); } catch (_) { /* element gone */ }
      });
    }

    function clearTraceHighlights() {
      document.querySelectorAll(".trace-highlight").forEach((el) => {
        el.classList.remove("trace-highlight");
      });
    }

    function scrollWithLineReposition(element, options) {
      if (!element) return;
      element.scrollIntoView(options);
      const scrollEnd = Date.now() + 800;
      const tick = () => {
        repositionDocumentCanvasLines();
        if (Date.now() < scrollEnd) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function getSummaryChildIds(summaryId, card) {
      if (card?.dataset.childIds) {
        return card.dataset.childIds.split(",").filter(Boolean);
      }
      return summaryChildMap.get(summaryId) || [];
    }

    function handleWorkspaceCardTrace(card) {
      const autoTraceToggle = document.getElementById("auto-trace-toggle");
      if (!autoTraceToggle?.checked) return;

      clearTraceHighlights();

      if (card.classList.contains("summary-card")) {
        const summaryId = card.dataset.nodeId || card.id.replace("summary-card-", "");
        card.classList.add("trace-highlight");

        const childIds = getSummaryChildIds(summaryId, card);
        let firstChildCard = null;
        for (const excerptId of childIds) {
          const childCard = document.getElementById(`excerpt-card-${excerptId}`);
          if (childCard) {
            childCard.classList.add("trace-highlight");
            if (!firstChildCard) firstChildCard = childCard;
          }
        }

        if (firstChildCard) {
          scrollWithLineReposition(firstChildCard, { behavior: "smooth", block: "center" });
        }

        let firstSpan = null;
        for (const excerptId of childIds) {
          const span = document.getElementById(`excerpt-${excerptId}`);
          if (span) {
            span.classList.add("trace-highlight");
            if (!firstSpan) firstSpan = span;
          }
        }

        if (firstSpan) {
          scrollWithLineReposition(firstSpan, { behavior: "smooth", block: "center" });
        }
        return;
      }

      if (card.classList.contains("excerpt-card")) {
        const excerptId = card.dataset.nodeId;
        card.classList.add("trace-highlight");

        const spanId = card.dataset.sourceSpan || `excerpt-${excerptId}`;
        const span = document.getElementById(spanId);
        if (span) {
          span.classList.add("trace-highlight");
          scrollWithLineReposition(span, { behavior: "smooth", block: "center" });
        }
      }
    }

    function clearDocSearchMarks() {
      docBody.querySelectorAll("mark.doc-search-match").forEach((mark) => {
        const parent = mark.parentNode;
        while (mark.firstChild) {
          parent.insertBefore(mark.firstChild, mark);
        }
        parent.removeChild(mark);
      });
      docBody.normalize();
      docSearchMatches = [];
      currentSearchIndex = -1;
    }

    function updateDocSearchCounter() {
      if (docSearchMatches.length === 0 || currentSearchIndex < 0) {
        docSearchCounter.textContent = `0/${docSearchMatches.length}`;
        return;
      }
      docSearchCounter.textContent = `${currentSearchIndex + 1}/${docSearchMatches.length}`;
    }

    function scrollActiveSearchIntoView(activeMark) {
      activeMark.scrollIntoView({ behavior: "smooth", block: "center" });
      repositionDocumentCanvasLines();
      const scrollEnd = Date.now() + 800;
      const tick = () => {
        repositionDocumentCanvasLines();
        if (Date.now() < scrollEnd) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function setActiveSearchMatch(index) {
      docSearchMatches.forEach((mark) => mark.classList.remove("doc-search-active"));

      if (index < 0 || index >= docSearchMatches.length) {
        currentSearchIndex = -1;
        updateDocSearchCounter();
        return;
      }

      currentSearchIndex = index;
      const activeMark = docSearchMatches[index];
      activeMark.classList.add("doc-search-active");
      updateDocSearchCounter();
      scrollActiveSearchIntoView(activeMark);
    }

    function wrapTextNodeMatches(textNode, query) {
      const text = textNode.nodeValue;
      const lowerText = text.toLowerCase();
      const lowerQuery = query.toLowerCase();
      const fragments = [];
      let lastIndex = 0;
      let idx = lowerText.indexOf(lowerQuery);

      while (idx !== -1) {
        if (idx > lastIndex) {
          fragments.push(document.createTextNode(text.slice(lastIndex, idx)));
        }
        const mark = document.createElement("mark");
        mark.className = "doc-search-match";
        mark.textContent = text.slice(idx, idx + query.length);
        fragments.push(mark);
        lastIndex = idx + query.length;
        idx = lowerText.indexOf(lowerQuery, lastIndex);
      }

      if (lastIndex === 0) return;

      if (lastIndex < text.length) {
        fragments.push(document.createTextNode(text.slice(lastIndex)));
      }

      const parent = textNode.parentNode;
      fragments.forEach((fragment) => parent.insertBefore(fragment, textNode));
      parent.removeChild(textNode);
    }

    function performDocSearch(query) {
      clearDocSearchMarks();
      const trimmed = query.trim();
      if (!trimmed) {
        updateDocSearchCounter();
        return;
      }

      const textNodes = [];
      const walker = document.createTreeWalker(docBody, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (node.parentElement?.closest("mark.doc-search-match")) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        },
      });

      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      for (let i = textNodes.length - 1; i >= 0; i -= 1) {
        wrapTextNodeMatches(textNodes[i], trimmed);
      }

      docSearchMatches = Array.from(docBody.querySelectorAll("mark.doc-search-match"));
      if (docSearchMatches.length > 0) {
        setActiveSearchMatch(0);
      } else {
        updateDocSearchCounter();
      }
    }

    function goToSearchMatch(direction) {
      if (docSearchMatches.length === 0) return;

      if (currentSearchIndex < 0) {
        setActiveSearchMatch(direction >= 0 ? 0 : docSearchMatches.length - 1);
        return;
      }

      const nextIndex =
        (currentSearchIndex + direction + docSearchMatches.length) % docSearchMatches.length;
      setActiveSearchMatch(nextIndex);
    }

    function clearDocSearch() {
      docSearchInput.value = "";
      clearDocSearchMarks();
      updateDocSearchCounter();
    }

    function initDocSearchListeners() {
      if (docSearchInput.dataset.bound) return;
      docSearchInput.dataset.bound = "1";

      docSearchInput.addEventListener("input", () => {
        clearTimeout(docSearchDebounceTimer);
        docSearchDebounceTimer = setTimeout(() => {
          performDocSearch(docSearchInput.value);
        }, 300);
      });

      docSearchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          goToSearchMatch(1);
        }
      });

      docSearchPrev.addEventListener("click", () => goToSearchMatch(-1));
      docSearchNext.addEventListener("click", () => goToSearchMatch(1));
      docSearchClear.addEventListener("click", clearDocSearch);
    }

    function buildHighlightedHtml(text, excerpts) {
      const matches = excerpts
        .map((e) => ({ id: e.id, content: e.content, idx: text.indexOf(e.content) }))
        .filter((m) => m.idx >= 0)
        .sort((a, b) => a.idx - b.idx);

      let html = "";
      let cursor = 0;
      for (const m of matches) {
        if (m.idx < cursor) continue;
        html += escapeHtml(text.slice(cursor, m.idx));
        html += `<span id="excerpt-${m.id}" class="excerpt-highlight">${escapeHtml(m.content)}</span>`;
        cursor = m.idx + m.content.length;
      }
      html += escapeHtml(text.slice(cursor));
      return html;
    }

    function buildSummaryChildMap(summaries) {
      const map = new Map();
      for (const summary of summaries) {
        if (!summary.excerpt_id) continue;
        if (!map.has(summary.id)) map.set(summary.id, []);
        const childIds = map.get(summary.id);
        if (!childIds.includes(summary.excerpt_id)) {
          childIds.push(summary.excerpt_id);
        }
      }
      return map;
    }

    function createWorkspaceCard(node) {
      const isExcerpt = node.density_level === 2;
      const card = document.createElement("div");
      card.id = isExcerpt ? `excerpt-card-${node.id}` : `summary-card-${node.id}`;
      card.className = isExcerpt
        ? "workspace-card excerpt-card"
        : "workspace-card summary-card";
      if (node.origin === "ingest") card.classList.add("ingest");

      if (isExcerpt) {
        card.dataset.nodeId = node.id;
        card.dataset.sourceSpan = `excerpt-${node.id}`;
        card.innerHTML = `
          <div class="card-label">Excerpt</div>
          <div class="card-content">${escapeHtml(node.content)}</div>
        `;
        card.addEventListener("click", (e) => {
          if (e.ctrlKey || e.metaKey || e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            toggleExcerptGrouping(node.id, card);
            return;
          }
          handleWorkspaceCardTrace(card);
        });
      } else {
        card.dataset.nodeId = node.id;
        const childIds = summaryChildMap.get(node.id) || [];
        if (childIds.length) card.dataset.childIds = childIds.join(",");
        card.innerHTML = `
          <div class="card-label">Summary</div>
          <div class="card-title">${escapeHtml(node.title)}</div>
          <div class="card-content">${escapeHtml(node.content)}</div>
        `;
        card.addEventListener("click", () => handleWorkspaceCardTrace(card));
      }

      return card;
    }

    function getDensityColumn(densityLevel) {
      return document.getElementById(densityLevel === 2 ? "col-excerpts" : "col-summaries");
    }

    function ensureWorkspaceColumn(densityLevel, columnId) {
      let col = document.getElementById(columnId);
      if (!col) {
        col = document.createElement("div");
        col.id = columnId;
        col.className = "density-column";
        col.dataset.density = String(densityLevel);
        nodePane.insertBefore(col, groupSynthesizeBtn);
        if (!col.dataset.scrollBound) {
          col.addEventListener("scroll", repositionDocumentCanvasLines);
          col.dataset.scrollBound = "1";
        }
      }
      return col;
    }

    function resetWorkspaceColumns() {
      nodePane.querySelectorAll(".density-column, .workspace-card, .inline-editor").forEach((el) => {
        el.remove();
      });
      ensureWorkspaceColumn(2, "col-excerpts");
      ensureWorkspaceColumn(1, "col-summaries");
    }

    function appendToDensityColumn(densityLevel, element) {
      getDensityColumn(densityLevel).appendChild(element);
    }

    function clearGroupingSelection() {
      selectedExcerptIds = [];
      getDensityColumn(2)?.querySelectorAll(".excerpt-card.selected-for-grouping").forEach((card) => {
        card.classList.remove("selected-for-grouping");
      });
      syncPromoteButtons();
      updateGroupSynthesizeButton();
    }

    function syncPromoteButtons() {
      getDensityColumn(2)?.querySelectorAll(".excerpt-card .promote-btn").forEach((btn) => btn.remove());
      for (const id of selectedExcerptIds) {
        const card = document.getElementById(`excerpt-card-${id}`);
        if (!card || card.querySelector(".promote-btn")) continue;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "promote-btn";
        btn.textContent = "⬆ Promote";
        card.appendChild(btn);
      }
    }

    function toggleExcerptGrouping(nodeId, card) {
      const idx = selectedExcerptIds.indexOf(nodeId);
      if (idx >= 0) {
        selectedExcerptIds.splice(idx, 1);
        card.classList.remove("selected-for-grouping");
      } else {
        selectedExcerptIds.push(nodeId);
        card.classList.add("selected-for-grouping");
      }
      syncPromoteButtons();
      updateGroupSynthesizeButton();
    }

    function updateGroupSynthesizeButton() {
      const count = selectedExcerptIds.length;
      groupSynthesizeBtn.style.display = count > 0 ? "block" : "none";
      groupSynthesizeBtn.textContent = `Synthesize Group (${count})`;
    }

    function deduplicateNodesById(nodes) {
      const seen = new Set();
      const unique = [];
      for (const node of nodes) {
        if (seen.has(node.id)) continue;
        seen.add(node.id);
        unique.push(node);
      }
      return unique;
    }

    function renderWorkspaceCards(excerpts, summaries) {
      summaryChildMap = buildSummaryChildMap(summaries);
      resetWorkspaceColumns();
      clearGroupingSelection();

      for (const excerpt of deduplicateNodesById(excerpts)) {
        appendToDensityColumn(2, createWorkspaceCard(excerpt));
      }
      for (const summary of deduplicateNodesById(summaries)) {
        appendToDensityColumn(1, createWorkspaceCard(summary));
      }
    }

    function addDocumentLeaderLine(startEl, endEl, style) {
      if (!startEl || !endEl) return;
      const line = new LeaderLine(startEl, endEl, style);
      documentLeaderLines.push(line);
    }

    const DOC_TO_EXCERPT_LINE = {
      color: "#deff9a",
      path: "fluid",
      startSocket: "right",
      endSocket: "left",
      size: 2,
    };

    const COLUMN_LINK_LINE = {
      color: "#4ade80",
      path: "fluid",
      startSocket: "right",
      endSocket: "left",
      size: 2,
      dash: { len: 6, gap: 4 },
    };

    function removeLeaderLinesTouchingElement(element) {
      if (!element) return;
      documentLeaderLines = documentLeaderLines.filter((line) => {
        const touches = line.start === element || line.end === element;
        if (touches) {
          try { line.remove(); } catch (_) { /* already removed */ }
        }
        return !touches;
      });
    }

    function removeLeaderLinesForCard(cardIdPrefix, nodeId) {
      removeLeaderLinesTouchingElement(document.getElementById(`${cardIdPrefix}${nodeId}`));
    }

    function drawDocToExcerptLine(excerptId) {
      addDocumentLeaderLine(
        document.getElementById(`excerpt-${excerptId}`),
        document.getElementById(`excerpt-card-${excerptId}`),
        DOC_TO_EXCERPT_LINE
      );
    }

    function drawChildToParentLine(childCardId, parentCardId, childPrefix, parentPrefix) {
      addDocumentLeaderLine(
        document.getElementById(`${childPrefix}${childCardId}`),
        document.getElementById(`${parentPrefix}${parentCardId}`),
        COLUMN_LINK_LINE
      );
    }

    function drawExcerptToSummaryLine(excerptId, summaryId) {
      drawChildToParentLine(excerptId, summaryId, "excerpt-card-", "summary-card-");
    }

    function drawGroupedExcerptToSummaryLines(summaryId, excerptIds) {
      for (const excerptId of excerptIds) {
        drawExcerptToSummaryLine(excerptId, summaryId);
      }
    }

    function promoteCardToSummaryUI(card, nodeId, childIds = []) {
      const content = card.querySelector(".card-content")?.textContent.trim() || "";
      const title = excerptTitle(content);

      removeLeaderLinesForCard("excerpt-card-", nodeId);

      card.classList.remove("excerpt-card", "selected-for-grouping");
      card.classList.add("summary-card");
      card.id = `summary-card-${nodeId}`;
      card.dataset.nodeId = nodeId;
      card.removeAttribute("data-source-span");
      summaryChildMap.set(nodeId, childIds);
      if (childIds.length) card.dataset.childIds = childIds.join(",");
      card.querySelector(".promote-btn")?.remove();

      card.innerHTML = `
        <div class="card-label">Summary</div>
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-content">${escapeHtml(content)}</div>
      `;

      card.addEventListener("click", () => handleWorkspaceCardTrace(card));
      appendToDensityColumn(1, card);
    }

    async function promoteExcerptToSummary(parentId) {
      const childIds = selectedExcerptIds.filter((id) => id !== parentId);
      if (childIds.length === 0) {
        showStatus("Select at least one other excerpt to promote under this summary.", true);
        return;
      }

      try {
        const putRes = await fetch(`${API_BASE}/api/nodes/${encodeURIComponent(parentId)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ density_level: 1 }),
        });
        if (!putRes.ok) {
          const body = await putRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to promote node");
        }

        for (const childId of childIds) {
          const edgeRes = await fetch(`${API_BASE}/api/edges`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_id: parentId,
              target_id: childId,
              relationship_type: "SUMMARIZES",
              strength: 1.0,
              origin: "human",
            }),
          });
          if (!edgeRes.ok) {
            const body = await edgeRes.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to create edge");
          }
        }

        const parentCard = document.getElementById(`excerpt-card-${parentId}`);
        if (parentCard) {
          promoteCardToSummaryUI(parentCard, parentId, childIds);
        }

        getDensityColumn(2)?.querySelectorAll(".excerpt-card.selected-for-grouping").forEach((card) => {
          card.classList.remove("selected-for-grouping");
          card.querySelector(".promote-btn")?.remove();
        });
        selectedExcerptIds = [];
        updateGroupSynthesizeButton();

        requestAnimationFrame(() => {
          drawGroupedExcerptToSummaryLines(parentId, childIds);
          repositionDocumentCanvasLines();
        });

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    function drawDocumentCanvasLines(excerpts, summaries) {
      clearDocumentCanvasLines();

      for (const excerpt of excerpts) {
        drawDocToExcerptLine(excerpt.id);
      }

      for (const summary of summaries) {
        drawExcerptToSummaryLine(summary.excerpt_id, summary.id);
      }
    }

    function isSelectionInsideDocBody(selection) {
      if (!selection.rangeCount) return false;
      const range = selection.getRangeAt(0);
      const container = range.commonAncestorContainer;
      const el = container.nodeType === Node.TEXT_NODE ? container.parentElement : container;
      return el && docBody.contains(el);
    }

    function unwrapPendingExtraction() {
      const pending = document.getElementById("pending-extraction");
      if (!pending) return;
      const parent = pending.parentNode;
      while (pending.firstChild) {
        parent.insertBefore(pending.firstChild, pending);
      }
      parent.removeChild(pending);
      parent.normalize();
    }

    function wrapSelectionInPendingSpan(range) {
      unwrapPendingExtraction();
      const span = document.createElement("span");
      span.id = "pending-extraction";

      try {
        range.surroundContents(span);
      } catch (_) {
        const fragment = range.extractContents();
        span.appendChild(fragment);
        range.insertNode(span);
      }

      return span;
    }

    function findParentExcerptId(element) {
      let current = element;
      while (current && current !== docBody) {
        if (current.id && current.id.startsWith("excerpt-")) {
          return current.id.slice("excerpt-".length);
        }
        current = current.parentElement;
      }
      return null;
    }

    function removeCanvasInlineEditor() {
      nodePane.querySelectorAll(".inline-editor").forEach((el) => el.remove());
    }

    function bindEditorSaveHotkey(textarea, saveBtn) {
      textarea.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          saveBtn.click();
        }
      });
    }

    function openCanvasInlineEditor(selectedText, anchorSpan) {
      removeCanvasInlineEditor();

      const template = document.getElementById("inline-editor-template");
      const editor = template.content.firstElementChild.cloneNode(true);
      const textarea = editor.querySelector("textarea");
      const densitySelect = editor.querySelector(".editor-density");
      const saveBtn = editor.querySelector(".editor-save");
      const cancelBtn = editor.querySelector(".editor-cancel");

      textarea.value = selectedText;
      densitySelect.value = "2";

      cancelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        unwrapPendingExtraction();
        editor.remove();
      });

      saveBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await saveCanvasExtraction(editor, textarea, densitySelect, saveBtn, anchorSpan);
      });

      bindEditorSaveHotkey(textarea, saveBtn);

      appendToDensityColumn(2, editor);
      editor.scrollIntoView({ behavior: "smooth", block: "nearest" });
      textarea.focus();
    }

    function getConcatenatedExcerptTexts(excerptIds) {
      const selectedTexts = [];
      for (const id of excerptIds) {
        const card = document.getElementById(`excerpt-card-${id}`);
        const contentEl = card?.querySelector(".card-content");
        if (contentEl) {
          const text = contentEl.textContent.trim();
          if (text) selectedTexts.push(text);
        }
      }
      return selectedTexts.join("\n\n");
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = `${textarea.scrollHeight}px`;
    }

    function openGroupSynthesisEditor() {
      removeCanvasInlineEditor();
      groupSynthesizeBtn.style.display = "none";

      const template = document.getElementById("inline-editor-template");
      const editor = template.content.firstElementChild.cloneNode(true);
      editor.dataset.groupSynthesis = "1";
      const textarea = editor.querySelector("textarea");
      const densitySelect = editor.querySelector(".editor-density");
      const saveBtn = editor.querySelector(".editor-save");
      const cancelBtn = editor.querySelector(".editor-cancel");

      densitySelect.value = "1";
      densitySelect.disabled = true;

      const groupedIds = [...selectedExcerptIds];
      const concatenatedText = getConcatenatedExcerptTexts(groupedIds);
      textarea.value = concatenatedText;
      autoResizeTextarea(textarea);

      cancelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        densitySelect.disabled = false;
        editor.remove();
        updateGroupSynthesizeButton();
      });

      saveBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await saveGroupSynthesis(editor, textarea, saveBtn, groupedIds);
      });

      bindEditorSaveHotkey(textarea, saveBtn);

      const summaryCol = getDensityColumn(1);
      summaryCol.insertBefore(editor, summaryCol.firstChild);

      editor.scrollIntoView({ behavior: "smooth", block: "nearest" });
      textarea.focus();
    }

    async function saveGroupSynthesis(editor, textarea, saveBtn, groupedExcerptIds) {
      const content = textarea.value.trim();
      if (!content) {
        showStatus("Content cannot be empty.", true);
        return;
      }
      if (groupedExcerptIds.length === 0) {
        showStatus("No excerpts selected for grouping.", true);
        return;
      }

      const title = excerptTitle(content);
      saveBtn.disabled = true;

      try {
        const nodeRes = await fetch(`${API_BASE}/api/nodes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            content,
            density_level: 1,
            significance: 1.0,
            origin: "human",
          }),
        });
        if (!nodeRes.ok) {
          const body = await nodeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create node");
        }
        const nodeData = await nodeRes.json();
        const summaryId = nodeData.node_id;

        for (const excerptId of groupedExcerptIds) {
          const edgeRes = await fetch(`${API_BASE}/api/edges`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_id: summaryId,
              target_id: excerptId,
              relationship_type: "SUMMARIZES",
              strength: 1.0,
              origin: "human",
            }),
          });
          if (!edgeRes.ok) {
            const body = await edgeRes.json().catch(() => ({}));
            throw new Error(body.detail || "Failed to create edge");
          }
        }

        getDensityColumn(2)?.querySelectorAll(".excerpt-card.selected-for-grouping").forEach((card) => {
          card.classList.remove("selected-for-grouping");
        });
        selectedExcerptIds = [];
        syncPromoteButtons();
        updateGroupSynthesizeButton();

        summaryChildMap.set(summaryId, groupedExcerptIds);

        const card = createWorkspaceCard({
          id: summaryId,
          title,
          content,
          density_level: 1,
          excerpt_id: groupedExcerptIds[0],
          origin: "human",
        });
        editor.replaceWith(card);

        requestAnimationFrame(() => {
          drawGroupedExcerptToSummaryLines(summaryId, groupedExcerptIds);
          repositionDocumentCanvasLines();
        });

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
        saveBtn.disabled = false;
        updateGroupSynthesizeButton();
      }
    }

    async function saveCanvasExtraction(editor, textarea, densitySelect, saveBtn, anchorSpan) {
      const content = textarea.value.trim();
      if (!content) {
        showStatus("Content cannot be empty.", true);
        return;
      }
      if (!documentCanvasSourceId) {
        showStatus("Document source not loaded.", true);
        return;
      }

      const densityLevel = parseInt(densitySelect.value, 10);
      const title = excerptTitle(content);
      saveBtn.disabled = true;

      try {
        const nodeRes = await fetch(`${API_BASE}/api/nodes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            content,
            density_level: densityLevel,
            significance: 1.0,
            origin: "human",
          }),
        });
        if (!nodeRes.ok) {
          const body = await nodeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create node");
        }
        const nodeData = await nodeRes.json();
        const nodeId = nodeData.node_id;

        let edgePayload;
        let excerptIdForLine;

        if (densityLevel === 1) {
          excerptIdForLine = findParentExcerptId(anchorSpan);
          if (!excerptIdForLine) {
            throw new Error("Summaries must be extracted from within an excerpt highlight.");
          }
          edgePayload = {
            source_id: nodeId,
            target_id: excerptIdForLine,
            relationship_type: "SUMMARIZES",
            strength: 1.0,
            origin: "human",
          };
          unwrapPendingExtraction();
        } else {
          edgePayload = {
            source_id: documentCanvasSourceId,
            target_id: nodeId,
            relationship_type: "CONTAINS",
            strength: 1.0,
            origin: "human",
          };
          anchorSpan.id = `excerpt-${nodeId}`;
          anchorSpan.classList.add("excerpt-highlight");
          anchorSpan.removeAttribute("style");
          excerptIdForLine = nodeId;
        }

        const edgeRes = await fetch(`${API_BASE}/api/edges`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(edgePayload),
        });
        if (!edgeRes.ok) {
          const body = await edgeRes.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to create edge");
        }

        if (densityLevel === 1) {
          summaryChildMap.set(nodeId, [excerptIdForLine]);
        }

        const card = createWorkspaceCard({
          id: nodeId,
          title,
          content,
          density_level: densityLevel,
          excerpt_id: excerptIdForLine,
          origin: "human",
        });
        const targetCol = getDensityColumn(densityLevel);
        editor.replaceWith(card);
        if (!card.parentElement) {
          targetCol.appendChild(card);
        }
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });

        requestAnimationFrame(() => {
          if (densityLevel === 2) {
            drawDocToExcerptLine(nodeId);
          } else {
            drawExcerptToSummaryLine(excerptIdForLine, nodeId);
          }
          repositionDocumentCanvasLines();
        });

        clearStatus();
      } catch (err) {
        showStatus(err.message, true);
        saveBtn.disabled = false;
      }
    }

    function initGroupSynthesisListeners() {
      if (groupSynthesizeBtn.dataset.bound) return;
      groupSynthesizeBtn.dataset.bound = "1";
      groupSynthesizeBtn.addEventListener("click", openGroupSynthesisEditor);

      nodePane.addEventListener("click", (e) => {
        const promoteBtn = e.target.closest(".promote-btn");
        if (!promoteBtn) return;
        e.preventDefault();
        e.stopPropagation();
        const card = promoteBtn.closest(".excerpt-card");
        const parentId = card?.dataset.nodeId;
        if (parentId) promoteExcerptToSummary(parentId);
      });
    }

    function handleCanvasExtraction(storedRange) {
      if (layoutToggle.value !== "workspace" || !documentCanvas.classList.contains("active")) {
        return;
      }

      let range;
      let text;

      if (storedRange) {
        text = storedRange.toString().trim();
        if (!text || !isRangeInsideDocBody(storedRange)) return;
        range = storedRange.cloneRange();
      } else {
        const selection = window.getSelection();
        text = selection.toString().trim();
        if (!text || !isSelectionInsideDocBody(selection)) return;
        range = selection.getRangeAt(0).cloneRange();
        selection.removeAllRanges();
      }

      const anchorSpan = wrapSelectionInPendingSpan(range);
      openCanvasInlineEditor(text, anchorSpan);
    }

    function isRangeInsideDocBody(range) {
      const container = range.commonAncestorContainer;
      const el = container.nodeType === Node.TEXT_NODE ? container.parentElement : container;
      return el && docBody.contains(el);
    }

    function hideCustomContextMenu() {
      customContextMenu.style.display = "none";
      canvasContextMenuRange = null;
    }

    function initDocContextMenuListeners() {
      if (docPane.dataset.contextMenuBound) return;
      docPane.dataset.contextMenuBound = "1";

      docPane.addEventListener("contextmenu", (e) => {
        if (layoutToggle.value !== "workspace" || !documentCanvas.classList.contains("active")) {
          return;
        }

        const selection = window.getSelection();
        const text = selection.toString().trim();
        if (!text || !isSelectionInsideDocBody(selection)) return;

        e.preventDefault();
        canvasContextMenuRange = selection.getRangeAt(0).cloneRange();
        customContextMenu.style.left = `${e.pageX}px`;
        customContextMenu.style.top = `${e.pageY}px`;
        customContextMenu.style.display = "block";
      });

      menuExtractBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const range = canvasContextMenuRange;
        hideCustomContextMenu();
        handleCanvasExtraction(range);
      });

      document.addEventListener("click", (e) => {
        if (!customContextMenu.contains(e.target)) {
          hideCustomContextMenu();
        }
      });
    }

    function focusDocumentCanvasTargets(summaryId, excerptId) {
      if (excerptId) {
        const span = document.getElementById(`excerpt-${excerptId}`);
        if (span) {
          span.classList.remove("excerpt-focus");
          void span.offsetWidth;
          span.classList.add("excerpt-focus");
          span.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(() => span.classList.remove("excerpt-focus"), 2000);
        }
      }

      const card =
        document.getElementById(`summary-card-${summaryId}`) ||
        document.getElementById(`excerpt-card-${summaryId}`);
      if (card) {
        card.classList.remove("workspace-focus");
        void card.offsetWidth;
        card.classList.add("workspace-focus");
        card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        setTimeout(() => card.classList.remove("workspace-focus"), 2000);
      }

      repositionDocumentCanvasLines();
      const scrollEnd = Date.now() + 800;
      const tick = () => {
        repositionDocumentCanvasLines();
        if (Date.now() < scrollEnd) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    async function initMacroGraph(sourceId) {
      destroyMacroCy();

      try {
        const res = await fetch(
          `${API_BASE}/api/macro_graph?source_id=${encodeURIComponent(sourceId)}`
        );
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to load macro graph");
        }
        const data = await res.json();

        macroPaneEmpty.style.display = data.nodes.length === 0 ? "flex" : "none";

        macroCy = cytoscape({
          container: macroGraphEl,
          elements: [...data.nodes, ...data.edges],
          style: macroCyStyles,
          userZoomingEnabled: false,
          userPanningEnabled: true,
          boxSelectionEnabled: false,
          autoungrabify: true,
          minZoom: 1,
          maxZoom: 1,
        });

        if (data.nodes.length > 0) {
          macroCy.layout({
            name: "dagre",
            rankDir: "TB",
            nodeSep: 20,
            rankSep: 40,
            animate: false,
          }).run();
          macroCy.fit(undefined, 30);
        }

        macroCyTapHandler = (evt) => {
          const node = evt.target;
          focusDocumentCanvasTargets(node.id(), node.data("excerpt_id"));
        };
        macroCy.on("tap", "node", macroCyTapHandler);
      } catch (err) {
        macroPaneEmpty.style.display = "flex";
        macroPaneEmpty.textContent = err.message;
        showStatus(err.message, true);
      }
    }

    async function initDocumentCanvas() {
      clearDocumentCanvasLines();
      clearDocSearch();
      docBody.innerHTML = "";
      docTitle.textContent = "";
      nodePane.querySelectorAll(".density-column, .workspace-card, .inline-editor").forEach((el) => {
        el.remove();
      });
      macroPaneEmpty.style.display = "flex";
      macroPaneEmpty.textContent = "No summaries yet.";

      try {
        const res = await fetch(`${API_BASE}/api/document-canvas`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "Failed to load document canvas");
        }
        const data = await res.json();

        documentCanvasSourceId = data.source.id;
        unwrapPendingExtraction();
        removeCanvasInlineEditor();

        docTitle.textContent = data.source.title;
        docBody.innerHTML = buildHighlightedHtml(data.document_text, data.excerpts);
        renderWorkspaceCards(data.excerpts, data.summaries);

        requestAnimationFrame(() => {
          drawDocumentCanvasLines(data.excerpts, data.summaries);
          initMacroGraph(data.source.id);
        });

        if (!docPane.dataset.scrollBound) {
          docPane.addEventListener("scroll", repositionDocumentCanvasLines);
          docPane.dataset.scrollBound = "1";
        }

        if (!nodePane.dataset.scrollBound) {
          nodePane.addEventListener("scroll", repositionDocumentCanvasLines);
          nodePane.dataset.scrollBound = "1";
        }

        initDocSearchListeners();
        initGroupSynthesisListeners();
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    function onLayoutChange() {
      const mode = layoutToggle.value;
      synthesisControls.style.display = mode === "bridge" ? "block" : "none";
      hideAllViewerPanels();

      if (mode === "workspace") {
        documentCanvas.classList.add("active");
        initDocumentCanvas();
        return;
      }

      cyContainer.classList.remove("hidden");

      if (mode === "bridge") return;

      restoreFullGraph(mode);
    }

    async function init() {
      cyContainer.classList.add("hidden");
      synthesisControls.style.display = "none";
      documentCanvas.classList.add("active");

      layoutToggle.addEventListener("change", onLayoutChange);
      generateBridgeBtn.addEventListener("click", generateBridge);
      initDocContextMenuListeners();
      initGroupSynthesisListeners();

      document.addEventListener("keydown", (e) => {
        if (!(e.ctrlKey || e.metaKey)) return;
        if (layoutToggle.value !== "workspace" || !documentCanvas.classList.contains("active")) {
          return;
        }

        const key = e.key.toLowerCase();
        if (key === "f") {
          e.preventDefault();
          docSearchInput.focus();
          docSearchInput.select();
          return;
        }

        if (key === "e") {
          if (e.target.closest("textarea, input, select")) return;
          e.preventDefault();
          hideCustomContextMenu();
          handleCanvasExtraction();
        }
      });

      try {
        showStatus("Loading…");
        const [graphData, allNodes] = await Promise.all([
          loadGraph(),
          loadBridgeNodes(),
          initDocumentCanvas(),
        ]);
        fullGraphData = graphData;
        fillBridgeSelects(allNodes);
        clearStatus();

        if (graphData.nodes.length === 0) {
          showStatus("No nodes in graph yet. Create some via the Input Pane.", true);
          return;
        }

        cy = cytoscape({
          container: document.getElementById("cy"),
          elements: graphData,
          style: cyStyles,
          minZoom: 0.05,
          maxZoom: 4,
          wheelSensitivity: 0.2,
        });
      } catch (err) {
        showStatus(err.message, true);
      }
    }

    init();
  </script>
</body>
</html>
