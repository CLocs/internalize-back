[project]
name = "internalize-back"
version = "0.1.0"
description = "Internalize MVP 1 — The Human Linker. Local-first semantic knowledge graph API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "neo4j>=5.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a live Neo4j instance",
    "e2e: requires running server and Playwright browser",
]
testpaths = ["tests"]
